                // --- Math panel toggle ---
                function positionMathPanel() {
                    // Panel is position:fixed, sized/placed from the toolbar's live
                    // viewport rect so it always has room and never hides under
                    // the viewport edge, on any device or scroll position.
                    const margin = 8;
                    const toolbarRect = toolbar.getBoundingClientRect();
                    const mathBtnRect = mathBtn.getBoundingClientRect();

                    // Reset so scrollWidth/Height measure the natural size first.
                    mathPanel.style.left = '0px';
                    mathPanel.style.top = '0px';
                    mathPanel.style.bottom = 'auto';
                    mathPanel.style.transform = 'none';

                    const panelW = Math.min(mathPanel.offsetWidth || 190, window.innerWidth - margin * 2);
                    const panelH = mathPanel.offsetHeight || 180;

                    const spaceAbove = toolbarRect.top;
                    const spaceBelow = window.innerHeight - toolbarRect.bottom;

                    // Prefer opening above the toolbar; if there isn't room,
                    // open below; if neither fits fully, use whichever side
                    // has more room and clamp within the viewport.
                    let top;
                    mathPanel.classList.remove('is-below');
                    if (spaceAbove >= panelH + margin || spaceAbove >= spaceBelow) {
                        top = toolbarRect.top - panelH - margin;
                        if (top < margin) top = margin;
                    } else {
                        top = toolbarRect.bottom + margin;
                        mathPanel.classList.add('is-below');
                        const maxTop = window.innerHeight - panelH - margin;
                        if (top > maxTop) top = Math.max(margin, maxTop);
                    }

                    // Center horizontally on the math button, clamped to viewport.
                    let left = mathBtnRect.left + (mathBtnRect.width / 2) - (panelW / 2);
                    left = Math.max(margin, Math.min(left, window.innerWidth - panelW - margin));

                    // If the panel is still taller than the viewport, cap its height.
                    const maxAvailableH = window.innerHeight - margin * 2;
                    if (panelH > maxAvailableH) {
                        mathPanel.style.maxHeight = `${maxAvailableH}px`;
                    } else {
                        mathPanel.style.maxHeight = '';
                    }

                    mathPanel.style.left = `${left}px`;
                    mathPanel.style.top = `${top}px`;
                }

                    if (!toolbar.classList.contains('is-visible')) {
                        toolbar.classList.add('is-visible');
                        toggleBtn.classList.add('is-active');
                    }
                    const isHidden = mathPanel.hidden;
                    mathPanel.hidden = !isHidden;
                    if (mathPanel.hidden === false) {
                        positionMathPanel();
                    }
                });

                window.addEventListener('resize', () => {
                    if (!mathPanel.hidden) positionMathPanel();

            function buildOptionRow(questionId, opt, index, lang, onCorrectToggle) {
                const row = document.createElement('div');
                row.className = 'option-row' + (opt.correct ? ' is-correct-row' : '');

                const label = document.createElement('button');
                label.type = 'button';
                label.className = 'option-row__label option-row__label--pickable' + (opt.correct ?
                    ' is-correct' : '');
                label.textContent = Utils.optionLabel(index, lang);
                label.title = lang === 'bn' ? 'সঠিক উত্তর হিসেবে চিহ্নিত করুন' : 'Mark as correct answer';
                label.setAttribute('aria-pressed', opt.correct ? 'true' : 'false');
                label.setAttribute('aria-label', `${lang === 'bn' ? 'সঠিক উত্তর নির্বাচন করুন' : 'Mark correct answer'}: ${Utils.optionLabel(index, lang)}`);
                row.appendChild(label);

                const editor = document.createElement('div');
                editor.className = 'editor-area';
                editor.contentEditable = 'true';
                editor.dataset.role = 'option';
                editor.dataset.optionId = opt.id;
                editor.dataset.placeholder = lang === 'bn' ? 'অপশন লিখুন...' : 'Option text...';
                editor.setAttribute('aria-label', `Option ${Utils.optionLabel(index, lang)}`);
                setEditorContent(editor, opt.html);
                row.appendChild(editor);

                bindEditableEvents(editor, (html) => {
                    State.updateOptionHtml(questionId, opt.id, html);
                    syncLayoutPickerUI(questionId);
                    appendTrailingCardIfNeeded(questionId);
                    Preview.update();
                });

                label.addEventListener('click', () => {
                    const nowAnyCorrect = State.toggleOptionCorrect(questionId, opt.id);
                    const isCorrectNow = label.classList.toggle('is-correct');
                    label.setAttribute('aria-pressed', isCorrectNow ? 'true' : 'false');
                    row.classList.toggle('is-correct-row', isCorrectNow);
                    if (onCorrectToggle) onCorrectToggle(nowAnyCorrect);
                    Preview.update();
                });

                return row;
            }

            function syncLayoutPickerUI(questionId) {
                const state = State.get();
                const q = state.questions.find(q => q.id === questionId);
                if (!q) return;
                const card = document.querySelector(`.question-card[data-id="${questionId}"]`);
                if (!card) return;
                card.querySelectorAll('.layout-btn').forEach(btn => {
                    btn.classList.toggle('is-active', btn.dataset.layout === (q.optionsLayout || 'vertical'));
                });
            }

            function setEditorContent(el, html) { el.innerHTML = html || '';
                toggleEmptyState(el); }

            function toggleEmptyState(el) { el.classList.toggle('is-empty', Utils.stripHtml(el.innerHTML) === ''); }

            function bindEditableEvents(el, onChangeCallback) {
                const debouncedChange = Utils.debounce(() => { onChangeCallback(Utils.sanitizeHtml(el.innerHTML)); }, 180);
                el.addEventListener('input', () => { toggleEmptyState(el);
                    debouncedChange(); });
                el.addEventListener('focus', () => { activeEditorEl = el; });
                el.addEventListener('keyup', () => rememberSelection(el));
                el.addEventListener('mouseup', () => rememberSelection(el));
                el.addEventListener('keydown', (e) => {
                    const mod = e.ctrlKey || e.metaKey;
                    if (!mod) return;
                    const key = e.key.toLowerCase();
                    if (key === 'b') { e.preventDefault();
                        execCommand('bold'); } else if (key === 'i') { e.preventDefault();
                        execCommand('italic'); } else if (key === 'u') { e.preventDefault();
                        execCommand('underline'); } else if (key === 'z') { e.preventDefault();
                        execCommand('undo'); } else if (key === 'y') { e.preventDefault();
                        execCommand('redo'); }
                });
            }

            function rememberSelection(el) {
                const sel = window.getSelection();
                if (sel.rangeCount > 0 && el.contains(sel.anchorNode)) {
                    activeSavedRange = sel.getRangeAt(0).cloneRange();
                }
            }

            function restoreSelection() {
                if (!activeSavedRange) return;
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(activeSavedRange);
            }

            function execCommand(cmd, value = null) {
                if (!activeEditorEl) return;
                activeEditorEl.focus();
                restoreSelection();
                try { document.execCommand(cmd, false, value); } catch (err) {
                    document.execCommand('styleWithCSS', false, true);
                    try { document.execCommand(cmd, false, value); } catch (e2) { /* no-op */ }
                }
                rememberSelection(activeEditorEl);
                toggleEmptyState(activeEditorEl);
                activeEditorEl.dispatchEvent(new Event('input', { bubbles: true }));
                // Update preview after formatting change
                Preview.update();
            }

            function insertTextAtCursor(el, text) {
                if (!el) return;
                el.focus();
                restoreSelection();
                document.execCommand('insertText', false, text);
                rememberSelection(el);
                toggleEmptyState(el);
                el.dispatchEvent(new Event('input', { bubbles: true }));
                Preview.update();
            }

            function initToolbar() {
                // Global event delegation for inline toolbar buttons
                document.addEventListener('click', (e) => {
                    const btn = e.target.closest('.inline-toolbar .rt-btn[data-cmd]');
                    if (btn) {
                        e.preventDefault();
                        const cmd = btn.dataset.cmd;
                        // If the command is for color, we handle via input event
                        if (cmd) {
                            // For commands like bold, italic, etc.
                            execCommand(cmd);
                        }
                    }
                    // Handle math/symbol insertion
                    const symbolBtn = e.target.closest('.inline-toolbar .rt-math-symbol[data-symbol]');
                    if (symbolBtn) {
                        e.preventDefault();
                        insertTextAtCursor(activeEditorEl, symbolBtn.dataset.symbol);
                    }
                    // Handle color picker input
                    const colorInput = e.target.closest('.inline-toolbar .rt-color input[type="color"]');
                    if (colorInput) {
                        // handled via input event
                    }
                    // Close button already has its own listener
                });

                // Color picker input
                document.addEventListener('input', (e) => {
                    const input = e.target.closest('.inline-toolbar .rt-color input[type="color"]');
                    if (input) {
                        const cmd = input.dataset.cmd;
                        const val = input.value;
                        document.execCommand('styleWithCSS', false, true);
                        execCommand(cmd, val);
                    }
                });

                // Close toolbar when clicking outside the card
                document.addEventListener('click', (e) => {
                    const toolbar = e.target.closest('.inline-toolbar');
                    const toggle = e.target.closest('.format-toggle-btn');
                    const card = e.target.closest('.question-card');
                    if (!toggle && !toolbar && !card) {
                        // Close all toolbars
                        document.querySelectorAll('.inline-toolbar.is-visible').forEach(tb => {
                            tb.classList.remove('is-visible');
                            const parentToggle = tb.closest('.question-card__controls').querySelector(
                                '.format-toggle-btn');
                            if (parentToggle) parentToggle.classList.remove('is-active');
                            const mathPanel = tb.querySelector('.rt-dropdown__panel');
                            if (mathPanel) mathPanel.hidden = true;
                        });
                    }
                });
            }

            return { renderQuestions, initToolbar };
        })();


        /* ================================================================
           DOC RENDERER & PREVIEW
           ================================================================ */
        const DocRenderer = (() => {
            function escapeHtml(str) { const div = document.createElement('div');
                div.textContent = str; return div.innerHTML; }

            function renderHeaderHtml(doc, lang, setCode) {
                const hasMeta = !!(doc.title || doc.subtitle || doc.marks || doc.time);
                let html = '';
                if (setCode) html +=
                    `<div class="doc__setcode">${lang === 'bn' ? 'সেট' : 'Set'}: ${escapeHtml(setCode)}</div>`;
                const titleText = doc.title || (lang === 'bn' ? 'শিরোনাম' : 'Examination Title');
                html += `<div class="doc__title">${escapeHtml(titleText)}</div>`;
                const subtitleText = doc.subtitle || (lang === 'bn' ? 'উপশিরোনাম' : 'Subtitle');
                html += `<div class="doc__subtitle">${escapeHtml(subtitleText)}</div>`;
                const marksText = doc.marks || (lang === 'bn' ? '০' : '0');
                const timeText = doc.time || (lang === 'bn' ? '০ মিনিট' : '0 Minutes');
                html += `<div class="doc__metarow">
              <span>${lang === 'bn' ? 'মান' : 'Marks'}: ${escapeHtml(marksText)}</span>
              <span>${lang === 'bn' ? 'সময়' : 'Time'}: ${escapeHtml(timeText)}</span>
            </div>`;
                html += `<div class="doc__divider"></div>`;
                if (doc.note) {
                    html += `<div class="doc__note">${lang === 'bn' ? 'নোট' : 'Note'}: ${escapeHtml(doc.note)}</div>`;
                } else {
                    html +=
                        `<div class="doc__note" style="color:#9CA3AF;">${lang === 'bn' ? 'নোট যোগ করুন...' : 'Add a note...'}</div>`;
                }
                return html;
            }

            function renderQuestionHtml(q, index, lang, withAnswers) {
                const num = Utils.formatQuestionNumber(index, lang);
                const layout = q.optionsLayout || 'vertical';
                const layoutClass = `doc-options--${layout}`;
                let html = `<div class="doc-question">
              <div class="doc-question__text">
                <span class="doc-question__number">${num}.</span>
                <span class="doc-question__content">${q.question.html || ''}</span>
              </div>
              <div class="doc-options ${layoutClass}">`;
                q.options.forEach((opt, oi) => {
                    const isCorrect = withAnswers && !!opt.correct;
                    html += `<div class="doc-option${isCorrect ? ' doc-option--correct' : ''}">
                <span class="doc-option__label">${Utils.optionLabel(oi, lang)}</span>
                <span class="doc-option__content">${opt.html || ''}</span>
              </div>`;
                });
                html += `</div>`;
                if (withAnswers && Utils.stripHtml(q.explanationHtml) !== '') {
                    html +=
                        `<div class="doc-explanation"><span class="doc-explanation__label">${lang === 'bn' ? 'ব্যাখ্যা' : 'Explanation'}:</span> <span class="doc-explanation__text">${q.explanationHtml}</span></div>`;
                }
                html += `</div>`;
                return html;
            }

            function renderFullDocumentHtml(questions, setCode, doc, lang, fontStack, settings, withAnswers) {
                const hasQuestionContent = questions.some(q =>
                    Utils.stripHtml(q.question.html) !== '' || q.options.some(o => Utils.stripHtml(o.html) !== '')
                );
                let html =
                    `<div class="doc" data-doc-font="${lang}" style="font-family:${fontStack};font-size:${settings.fontSize}pt;color:${settings.fontColor};">`;
                html += renderHeaderHtml(doc, lang, setCode);
                if (!hasQuestionContent) {
                    html +=
                        `<div class="doc--empty-state">${lang === 'bn' ? 'প্রশ্ন যোগ করুন প্রিভিউ দেখতে...' : 'Add a question to see the live preview...'}</div>`;
                } else {
                    html += `<div class="doc__questions">`;
                    questions.forEach((q, i) => { html += renderQuestionHtml(q, i, lang, withAnswers); });
                    html += `</div>`;
                }
                html += `</div>`;
                return html;
            }

            function paginate(questions, setCode, doc, lang, fontStack, settings, pageSizeKey, withAnswers) {
                const dims = Preview.PAGE_SIZES_MM[pageSizeKey] || Preview.PAGE_SIZES_MM.A4;
                const MM_TO_PX = 96 / 25.4;
                const paddingMm = 18 * 2;
                const pageContentHeightPx = (dims.h - paddingMm) * MM_TO_PX;
                const headerHtml = renderHeaderHtml(doc, lang, setCode);
                const probe = document.createElement('div');
                probe.className = 'paper';
                probe.style.position = 'fixed';
                probe.style.left = '-99999px';
                probe.style.top = '0';
                probe.style.width = `${dims.w}mm`;
                probe.style.boxShadow = 'none';
                probe.style.height = 'auto';
                probe.style.minHeight = '0';
                document.body.appendChild(probe);
                const docWrap = document.createElement('div');
                docWrap.className = 'doc';
                docWrap.dataset.docFont = lang;
                docWrap.style.fontFamily = fontStack;
                docWrap.style.fontSize = `${settings.fontSize}pt`;
                docWrap.style.color = settings.fontColor;
                probe.appendChild(docWrap);
                docWrap.innerHTML = headerHtml;
                const headerHeightPx = docWrap.getBoundingClientRect().height;
                const questionsHost = document.createElement('div');
                questionsHost.className = 'doc__questions';
                docWrap.appendChild(questionsHost);

                function measureBlockHeight(questionSlice) {
                    questionsHost.innerHTML = questionSlice.map(({ q, index }) => renderQuestionHtml(q, index, lang,
                        withAnswers)).join('');
                    return questionsHost.getBoundingClientRect().height;
                }
                const pages = [];
                let remaining = questions.map((q, index) => ({ q, index }));
                let isFirst = true;
                while (remaining.length > 0) {
                    const budget = isFirst ? Math.max(pageContentHeightPx - headerHeightPx, pageContentHeightPx *
                        0.3) : pageContentHeightPx;
                    let lo = 1,
                        hi = remaining.length,
                        best = 1;
                    if (measureBlockHeight(remaining) <= budget) { best = remaining.length; } else {
                        while (lo <= hi) { const mid = Math.floor((lo + hi) / 2); const slice = remaining.slice(0,
                                mid); const h = measureBlockHeight(slice); if (h <= budget) { best = mid;
                                lo = mid + 1; } else { hi = mid - 1; } }
                        best = Math.max(best, 1);
                    }
                    pages.push({ questions: remaining.slice(0, best), isFirstPage: isFirst });
                    remaining = remaining.slice(best);
                    isFirst = false;
                }
                if (pages.length === 0) pages.push({ questions: [], isFirstPage: true });
                document.body.removeChild(probe);
                return pages.map(page => {
                    let html =
                        `<div class="doc" data-doc-font="${lang}" style="font-family:${fontStack};font-size:${settings.fontSize}pt;color:${settings.fontColor};">`;
                    if (page.isFirstPage) html += headerHtml;
                    if (page.questions.length > 0) {
                        html += `<div class="doc__questions">`;
                        page.questions.forEach(({ q, index }) => { html += renderQuestionHtml(q, index, lang,
                            withAnswers); });
                        html += `</div>`;
                    } else {
                        html +=
                            `<div class="doc--empty-state">${lang === 'bn' ? 'প্রশ্ন যোগ করুন প্রিভিউ দেখতে...' : 'Add a question to see the live preview...'}</div>`;
                    }
                    html += `</div>`;
                    return html;
                });
            }
            return { renderFullDocumentHtml, renderHeaderHtml, renderQuestionHtml, paginate, escapeHtml };
        })();


        const Preview = (() => {
            const PAGE_SIZES_MM = { A4: { w: 210, h: 297 }, Letter: { w: 215.9, h: 279.4 }, Legal: { w: 215.9,
                    h: 355.6 } };
            const FONT_STACKS = {
                'Calibri': "'Calibri','Carlito',Arial,sans-serif",
                'Times New Roman': "'Times New Roman',Times,serif",
                'Cambria Math': "'Cambria Math','Cambria',serif",
                'Kalpurush': "'Kalpurush','Noto Serif Bengali',sans-serif",
                'Noto Serif Bengali': "'Noto Serif Bengali',serif",
                'Hind Siliguri': "'Hind Siliguri',sans-serif",
                'Shonar Bangla': "'Shonar Bangla','Noto Serif Bengali',sans-serif",
                'Nikosh BAN': "'Nikosh BAN','Noto Serif Bengali',sans-serif"
            };

            function currentQuestions() {
                const state = State.get();
                if (state.setCode.enabled && state.activeSetIndex >= 0 && state.generatedSets[state.activeSetIndex]) {
                    return state.generatedSets[state.activeSetIndex].questions;
                }
                // Leave out the spare trailing empty box (see State.ensureTrailingEmpty)
                // so it never shows up in the preview — only questions the user has
                // actually typed into count.
                return state.questions.filter(q => !Utils.isQuestionEmpty(q));
            }

            function currentSetCode() {
                const state = State.get();
                if (state.setCode.enabled && state.activeSetIndex >= 0 && state.generatedSets[state.activeSetIndex]) {
                    return state.generatedSets[state.activeSetIndex].setCode;
                }
                return null;
            }

            function applyPaperDimensions() {
                const state = State.get();
                const dims = PAGE_SIZES_MM[state.settings.pageSize] || PAGE_SIZES_MM.A4;
                document.querySelectorAll('#paperWrap .paper').forEach(paper => {
                    paper.style.width = `${dims.w}mm`;
                    paper.style.minHeight = `${dims.h}mm`;
                    paper.style.background = state.settings.pageColor || '#FFFFFF';
                });
            }

            function computeFitZoom() {
                const state = State.get();
                const dims = PAGE_SIZES_MM[state.settings.pageSize] || PAGE_SIZES_MM.A4;
                const container = document.getElementById('previewContainer');
                if (!container) return 100;
                const MM_TO_PX = 96 / 25.4;
                const paperW = dims.w * MM_TO_PX;
                const paperH = dims.h * MM_TO_PX;
                const cRect = container.getBoundingClientRect();
                const pad = 40;
                const availW = cRect.width - pad;
                const availH = cRect.height - pad;
                const scaleW = availW / paperW;
                const scaleH = availH / paperH;
                const fitScale = Math.min(scaleW, scaleH, 1.2);
                return Math.round(fitScale * 100);
            }

            function applyZoom() {
                const state = State.get();
                const fitZoom = state.settings.fitZoom || computeFitZoom();
                const zoom = state.settings.zoom;
                const scale = (zoom / 100) * (fitZoom / 100);
                const wrap = document.getElementById('paperWrap');
                wrap.style.transform = `scale(${scale})`;
                document.getElementById('zoomValue').textContent = `${zoom}%`;
            }

            function renderDocumentBody(resetScroll) {
                const state = State.get();
                const lang = state.language;
                const doc = state.document;
                const questions = currentQuestions();
                const setCode = currentSetCode();
                const fontStack = FONT_STACKS[state.settings.fontFamily] || FONT_STACKS['Times New Roman'];
                const dims = PAGE_SIZES_MM[state.settings.pageSize] || PAGE_SIZES_MM.A4;

                const hasQuestionContent = questions.some(q =>
                    Utils.stripHtml(q.question.html) !== '' || q.options.some(o => Utils.stripHtml(o.html) !== '')
                );
                const wrap = document.getElementById('paperWrap');

                let pageHtmlList;
                if (!hasQuestionContent) {
                    pageHtmlList = [DocRenderer.renderFullDocumentHtml(questions, setCode, doc, lang, fontStack, state
                        .settings)];
                } else {
                    pageHtmlList = DocRenderer.paginate(questions, setCode, doc, lang, fontStack, state.settings, state
                        .settings.pageSize);
                }

                wrap.innerHTML = pageHtmlList.map((pageHtml, i) => {
                    const pageLabel = lang === 'bn' ?
                        `পৃষ্ঠা ${Utils.toBanglaNumber(i + 1)}` :
                        `Page ${Utils.toEnglishNumber(i + 1)}`;
                    return `<div class="paper" id="${i === 0 ? 'paper' : ''}" data-page="${i + 1}" data-page-label="${pageLabel}" role="img" aria-label="Question paper preview, page ${i + 1}">${pageHtml}</div>`;
                }).join('');

                wrap.classList.toggle('paper-wrap--multipage', pageHtmlList.length > 1);

                if (pageHtmlList.length > 0) {
                    wrap.querySelectorAll('.paper').forEach((paperEl, i) => {
                        const footer = document.createElement('div');
                        footer.className = 'doc__pagenum';
                        const pageNum = i + 1;
                        const total = pageHtmlList.length;
                        if (lang === 'bn') {
                            footer.textContent =
                                `পৃষ্ঠা ${Utils.toBanglaNumber(pageNum)}/${Utils.toBanglaNumber(total)}`;
                        } else {
                            footer.textContent =
                                `Page ${Utils.toEnglishNumber(pageNum)}/${Utils.toEnglishNumber(total)}`;
                        }
                        paperEl.appendChild(footer);
                    });
                }

                applyPaperDimensions();

                const fit = computeFitZoom();
                state.settings.fitZoom = fit;
                if (state.settings.zoom === 100) {
                    const scale = fit / 100;
                    wrap.style.transform = `scale(${scale})`;
                    document.getElementById('zoomValue').textContent = `100%`;
                } else {
                    applyZoom();
                }

                if (resetScroll) {
                    const container = document.getElementById('previewContainer');
                    if (container) container.scrollTop = 0;
                }
            }

            function renderSetPicker() {
                const state = State.get();
                const wrap = document.getElementById('setSwitch');
                const select = document.getElementById('setPicker');
                if (!state.setCode.enabled || state.generatedSets.length === 0) { wrap.hidden = true; return; }
                wrap.hidden = false;
                select.innerHTML = state.generatedSets.map((s, i) =>
                    `<option value="${i}">${state.language === 'bn' ? 'সেট' : 'Set'} ${DocRenderer.escapeHtml(s.setCode)}</option>`
                ).join('');
                if (state.activeSetIndex < 0 || state.activeSetIndex >= state.generatedSets.length) {
                    state.activeSetIndex = 0;
                }
                select.value = String(state.activeSetIndex);
            }

            const update = Utils.debounce((resetScroll) => { renderDocumentBody(!!resetScroll);
                renderSetPicker(); }, 60);

            function updateImmediate(resetScroll) { renderDocumentBody(!!resetScroll);
                renderSetPicker(); }

            return { update, updateImmediate, applyZoom, applyPaperDimensions, computeFitZoom, PAGE_SIZES_MM,
                FONT_STACKS, currentQuestions, currentSetCode };
        })();


        /* ================================================================
           RANDOMIZER
           ================================================================ */
        const Randomizer = (() => {
            function parseSetNames(raw, count) {
                const names = (raw || '').split(',').map(s => s.trim()).filter(Boolean);
                const result = [];
                for (let i = 0; i < count; i++) result.push(names[i] || String.fromCharCode(65 + i));
                return result;
            }

            function randomizeOptionsForQuestion(question) {
                const clone = Utils.clone(question);
                clone.options = Utils.shuffle(clone.options);
                return clone;
            }

            function buildSetQuestions(baseQuestions, randomizationType) {
                let questions = Utils.clone(baseQuestions);
                if (randomizationType === 'questions' || randomizationType === 'both') questions = Utils.shuffle(
                questions);
                if (randomizationType === 'options' || randomizationType === 'both') questions = questions.map(
                    randomizeOptionsForQuestion);
                return questions;
            }

            function generateSets() {
                const state = State.get();
                const count = Utils.clamp(parseInt(state.setCode.numberOfSets, 10) || 1, 1, 26);
                const names = parseSetNames(state.setCode.codeNames, count);
                const randType = state.setCode.randomization;
                const realQuestions = state.questions.filter(q => !Utils.isQuestionEmpty(q));
                const sets = names.map(name => ({ setCode: name, questions: buildSetQuestions(realQuestions,
                        randType) }));
                state.generatedSets = sets;
                state.activeSetIndex = 0;
                return sets;
            }

            function clearSets() { const state = State.get();
                state.generatedSets = [];
                state.activeSetIndex = -1; }
            return { generateSets, clearSets, parseSetNames };
        })();


        /* ================================================================
           PDF GEN
           ================================================================ */
        const PdfGen = (() => {
            // 2.0x ≈ 192 DPI at CSS 96dpi baseline — sharp enough for print
            // text while using noticeably less canvas memory than the
            // previous 2.83x (~270 DPI), which matters most on long
            // documents (100s of questions) where every page's canvas adds
            // up.
            const PDF_RENDER_DPI_SCALE = 2.0;

            // html2canvas / jsPDF / JSZip are large (combined, noticeably
            // heavier than the rest of the app's JS) and only needed once
            // the user actually asks to download — loading them eagerly on
            // every page visit was blocking initial render for
            // functionality most visits never touch. These are fetched on
            // demand, once, the first time a download is requested; the
            // browser caches each script after that, so repeat downloads
            // in the same session (or a later visit) don't pay this cost
            // again.
            const LIB_URLS = {
                html2canvas: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
                jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
                jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
            };
            const loadedScripts = {};

            function loadScriptOnce(key, url) {
                if (window[key === 'jspdf' ? 'jspdf' : key === 'jszip' ? 'JSZip' : 'html2canvas']) {
                    return Promise.resolve();
                }
                if (loadedScripts[key]) return loadedScripts[key];
                loadedScripts[key] = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = url;
                    script.onload = () => resolve();
                    script.onerror = () => { delete loadedScripts[key];
                        reject(new Error(`Failed to load ${key}`)); };
                    document.head.appendChild(script);
                });
                return loadedScripts[key];
            }

            // Loads whichever of html2canvas/jsPDF/JSZip aren't already
            // present, in parallel. Safe to call every time before a
            // download — resolves immediately for anything already loaded
            // or in flight from a previous call.
            async function ensureCoreLibsLoaded() {
                await Promise.all([
                    loadScriptOnce('html2canvas', LIB_URLS.html2canvas),
                    loadScriptOnce('jspdf', LIB_URLS.jspdf)
                ]);
            }
            function ensureZipLoaded() {
                return loadScriptOnce('jszip', LIB_URLS.jszip);
            }

            function checkDependencies() {
                const missing = [];
                if (!window.html2canvas) missing.push('html2canvas');
                if (!(window.jspdf && window.jspdf.jsPDF)) missing.push('jsPDF');
                return missing;
            }

            function buildOffscreenPage(pageHtml, pageColor) {
                const node = document.createElement('div');
                node.className = 'paper';
                node.style.position = 'fixed';
                node.style.left = '-99999px';
                node.style.top = '0';
                node.style.margin = '0';
                node.style.boxShadow = 'none';
                node.style.background = pageColor || '#FFFFFF';
                node.innerHTML = pageHtml;
                document.body.appendChild(node);
                return node;
            }

            // Attaches an offscreen node and sizes it, but does not wait or
            // rasterize yet. Split out from rasterizePage so a whole batch
            // of nodes can be attached first, then all wait on a *single*
            // shared double-rAF instead of one wait per page.
            function attachOffscreenPage(pageHtml, widthPx, pageColor) {
                const node = buildOffscreenPage(pageHtml, pageColor);
                node.style.width = `${widthPx}px`;
                return node;
            }

            // Waits one double-rAF (layout settles on the *next* paint
            // after styles are applied, so a single rAF isn't always
            // enough) then rasterizes an already-attached node.
            async function rasterizeAttachedPage(node, widthPx, heightPxMin, pageColor) {
                node.style.minHeight = `${heightPxMin}px`;
                const actualHeight = Math.max(node.scrollHeight, heightPxMin);
                const canvas = await html2canvas(node, {
                    scale: PDF_RENDER_DPI_SCALE,
                    useCORS: true,
                    backgroundColor: pageColor || '#FFFFFF',
                    width: widthPx,
                    height: actualHeight,
                    windowWidth: widthPx,
                    // Question papers here are text-only (no images), so
                    // html2canvas has nothing to wait on. The default
                    // 15000ms timeout only matters when an <img> is present
                    // and slow/broken; a short cap avoids ever stalling a
                    // page on that path without affecting text-only pages
                    // at all.
                    imageTimeout: 2000
                });
                document.body.removeChild(node);
                return canvas;
            }

            // Rasterizes a batch of pages sharing one double-rAF wait
            // instead of paying it per page. Safe because each node is an
            // independent, already-offscreen DOM subtree — attaching all
            // of them first just means the browser lays them all out on
            // the same frame.
            async function rasterizePageBatch(pageHtmlList, widthPx, heightPxMin, pageColor) {
                const nodes = pageHtmlList.map(html => attachOffscreenPage(html, widthPx, pageColor));
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                return Promise.all(nodes.map(node => rasterizeAttachedPage(node, widthPx, heightPxMin, pageColor)));
            }

            async function rasterizePage(pageHtml, widthPx, heightPxMin, pageColor) {
                const [canvas] = await rasterizePageBatch([pageHtml], widthPx, heightPxMin, pageColor);
                return canvas;
            }

            // Releases a canvas's backing pixel buffer as soon as we're done
            // reading it. Browsers don't always reclaim canvas memory
            // immediately on garbage collection, so shrinking it to 0x0
            // right after toDataURL() frees the (often multi-megapixel)
            // buffer sooner — important when generating many pages in a row.
            function releaseCanvas(canvas) {
                canvas.width = 0;
                canvas.height = 0;
            }

            async function generateSinglePdf(questions, setCode, withAnswers) {
                questions = questions.filter(q => !Utils.isQuestionEmpty(q));
                const missing = checkDependencies();
                if (missing.length) throw new Error(`${missing.join(' & ')} failed to load`);
                const state = State.get();
                const lang = state.language;
                const doc = state.document;
                const sizeKey = state.settings.pageSize;
                const dims = Preview.PAGE_SIZES_MM[sizeKey] || Preview.PAGE_SIZES_MM.A4;
                const fontStack = Preview.FONT_STACKS[state.settings.fontFamily] || Preview.FONT_STACKS['Times New Roman'];
                const unitFormat = sizeKey === 'A4' ? 'a4' : (sizeKey === 'Letter' ? 'letter' : 'legal');
                const MM_TO_PX = 96 / 25.4;
                const widthPx = Math.round(dims.w * MM_TO_PX);
                const heightPx = Math.round(dims.h * MM_TO_PX);
                const hasQuestionContent = questions.some(q =>
                    Utils.stripHtml(q.question.html) !== '' || q.options.some(o => Utils.stripHtml(o.html) !== '')
                );
                const pageHtmlList = hasQuestionContent ?
                    DocRenderer.paginate(questions, setCode, doc, lang, fontStack, state.settings, sizeKey,
                        withAnswers) :
                    [DocRenderer.renderFullDocumentHtml(questions, setCode, doc, lang, fontStack, state.settings,
                        withAnswers)];
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: unitFormat, compress: true });
                const totalPages = pageHtmlList.length;

                // Build the final HTML (with page-number label) for every
                // page up front, so the batching loop below only has to
                // deal with rendering.
                const finalPageHtmlList = pageHtmlList.map((pageHtml, i) => {
                    if (totalPages <= 1) return pageHtml;
                    const pageNum = i + 1;
                    const pageLabelText = lang === 'bn' ?
                        `পৃষ্ঠা ${Utils.toBanglaNumber(pageNum)}/${Utils.toBanglaNumber(totalPages)}` :
                        `Page ${Utils.toEnglishNumber(pageNum)}/${Utils.toEnglishNumber(totalPages)}`;
                    return pageHtml + `<div class="doc__pagenum">${DocRenderer.escapeHtml(pageLabelText)}</div>`;
                });

                // Rasterizing is mostly the browser's layout/paint work, not
                // JS execution, so a handful of pages can be rasterized
                // concurrently (each in its own offscreen node) and the
                // browser will parallelize the actual painting across
                // cores. Batch size of 4 balances that speedup against
                // memory — each in-flight canvas can be several MB, so
                // rendering everything at once on a 100+ page document
                // risks running out of memory. (Raised from 3: these
                // documents are text-only, no images, so each canvas is
                // lighter and a larger batch is safe.)
                const BATCH_SIZE = 4;
                for (let batchStart = 0; batchStart < finalPageHtmlList.length; batchStart += BATCH_SIZE) {
                    const batch = finalPageHtmlList.slice(batchStart, batchStart + BATCH_SIZE);
                    const canvases = await rasterizePageBatch(batch, widthPx, heightPx, state.settings.pageColor);
                    for (let j = 0; j < canvases.length; j++) {
                        const i = batchStart + j;
                        const canvas = canvases[j];
                        // PNG is lossless — unlike JPEG it doesn't blur or add
                        // artifacts around sharp text edges/borders, which is
                        // what a question paper mostly consists of. File size
                        // is larger than the old JPEG output, but text (Bangla
                        // in particular) comes out sharp instead of soft.
                        const imgData = canvas.toDataURL('image/png');
                        const renderedHeightMm = (canvas.height / canvas.width) * dims.w;
                        releaseCanvas(canvas);
                        if (i > 0) pdf.addPage(unitFormat, 'portrait');
                        pdf.addImage(imgData, 'PNG', 0, 0, dims.w, Math.min(renderedHeightMm, dims.h), undefined, 'FAST');
                    }
                    // Yield a tick back to the browser between batches so it
                    // gets a real chance to garbage-collect the buffers
                    // already released, instead of the whole document's
                    // worth of canvases piling up with no gap for cleanup.
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
                return pdf;
            }

            // Cleans a string for use as a file name. Keeps Unicode text (Bangla,
            // etc.) intact — only strips characters that are actually illegal in
            // file names (\ / : * ? " < > |) plus control characters, and
            // collapses whitespace. Falls back to 'Document' only if nothing
            // usable is left (e.g. the source was empty or pure punctuation).
            function safeFileName(str) {
                const cleaned = String(str || '')
                    .replace(/[\\/:*?"<>|]+/g, ' ')
                    .replace(/[\u0000-\u001F\u007F]+/g, ' ')
                    .trim()
                    .replace(/\s+/g, '_');
                return (cleaned || 'Document').slice(0, 60);
            }

            function anyCorrectAnswerMarked(questions) {
                return questions.some(q => q.options.some(o => o.correct));
            }

            // Guarantees unique file names inside a zip even if two set codes
            // clean down to the same text (e.g. duplicate codes, or codes that
            // only differ by punctuation that gets stripped).
            function makeUniqueNamer() {
                const used = new Map();
                return (base) => {
                    if (!used.has(base)) { used.set(base, 1);
                        return base; }
                    const n = used.get(base) + 1;
                    used.set(base, n);
                    return `${base}_${n}`;
                };
            }

            function downloadBlob(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 4000);
            }

            // True when the current document would actually produce an answer
            // key alongside the question paper (i.e. a "both" download exists
            // and the split-menu choice is meaningful). Used by the UI to
            // decide whether to show the download menu or just download the
            // single PDF directly.
            function hasAnswerKey() {
                const state = State.get();
                return anyCorrectAnswerMarked(state.questions);
            }

            // Downloads only the sets/PDFs, never touching the answer-key
            // rendering pass at all. This is the low-memory path: at most one
            // rasterization pass per set instead of two, and no mixed zip.
            // withAnswers selects whether that single pass renders the
            // question paper (false) or the answer key (true).
            async function downloadOneKind(withAnswers) {
                const state = State.get();
                const title = state.document.title || 'MCQ_Question_Paper';
                const baseName = safeFileName(title);
                const suffix = withAnswers ? '_Answer_Key' : '';
                const kindLabel = withAnswers ? 'Answer key' : 'Question paper';

                if (state.setCode.enabled && state.generatedSets.length > 1) {
                    await ensureZipLoaded();
                    if (!window.JSZip) throw new Error('JSZip failed to load');
                    const zip = new JSZip();
                    const uniqueName = makeUniqueNamer();
                    for (const set of state.generatedSets) {
                        const setLabel = uniqueName(safeFileName(set.setCode));
                        const pdf = await generateSinglePdf(set.questions, set.setCode, withAnswers);
                        zip.file(`${baseName}_Set_${setLabel}${suffix}.pdf`, pdf.output('blob'));
                    }
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    downloadBlob(zipBlob, `${baseName}_All_Sets${suffix}.zip`);
                    App.toast(`${kindLabel} ZIP (all sets) generated successfully`, 'success');
                } else if (state.setCode.enabled && state.generatedSets.length === 1) {
                    const set = state.generatedSets[0];
                    const setLabel = safeFileName(set.setCode);
                    const pdf = await generateSinglePdf(set.questions, set.setCode, withAnswers);
                    pdf.save(`${baseName}_Set_${setLabel}${suffix}.pdf`);
                    App.toast(`${kindLabel} PDF generated successfully`, 'success');
                } else {
                    const pdf = await generateSinglePdf(state.questions, null, withAnswers);
                    pdf.save(`${baseName}${suffix}.pdf`);
                    App.toast(`${kindLabel} PDF generated successfully`, 'success');
                }
            }

            async function runDownload(task) {
                const btn = document.getElementById('btnDownload');
                const originalIcon = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="ai-spin-icon"></i>';
                if (window.lucide) lucide.createIcons();
                try {
                    await ensureCoreLibsLoaded();
                    const missing = checkDependencies();
                    if (missing.length) { throw new Error(
                            `Required library failed to load: ${missing.join(', ')}. Check your internet connection.`
                            ); }
                    await task();
                } catch (err) {
                    console.error('PDF generation failed:', err);
                    App.toast('Unable to generate PDF. Please try again.', 'error');
                } finally { btn.disabled = false;
                    btn.innerHTML = originalIcon;
                    if (window.lucide) lucide.createIcons(); }
            }

            // Downloads only the question paper(s) — no answer-key rendering
            // pass runs at all, and nothing is zipped together with answers.
            function downloadQuestionPaperOnly() {
                return runDownload(() => downloadOneKind(false));
            }

            // Downloads only the answer key(s) — no question-paper rendering
            // pass runs at all.
            function downloadAnswerKeyOnly() {
                return runDownload(() => downloadOneKind(true));
            }

            // Exposed so the app can start fetching these in the background
            // once the page has settled (see App.init), so by the time the
            // user actually clicks Download the libraries are likely
            // already cached and the click itself doesn't have to wait on
            // the network. Failures here are silent — if the prefetch
            // doesn't finish in time, the normal on-demand load inside
            // runDownload() still covers it.
            function prefetchLibsInBackground() {
                ensureCoreLibsLoaded().catch(() => {});
                ensureZipLoaded().catch(() => {});
            }

            return { downloadQuestionPaperOnly, downloadAnswerKeyOnly, hasAnswerKey, prefetchLibsInBackground, ensureZipLoaded };
        })();



        /* ================================================================

        const Storage = (() => {
            const KEY = 'mcqGenerator.project.v1';
            let available = true;

            function checkAvailability() {
                try { const testKey = '__mcq_storage_test__';
                    localStorage.setItem(testKey, '1');
                    localStorage.removeItem(testKey);
                    available = true; } catch (e) { available = false; }
                return available;
            }

            function save() {
                if (!checkAvailability()) { App.toast('Automatic saving is unavailable in this browser.', 'error'); return false; }
                try { const payload = JSON.stringify(State.get());
                    localStorage.setItem(KEY, payload); return true; } catch (e) { console.error('Save failed:', e);
                    App.toast('Unable to save your project.', 'error'); return false; }
            }

            function load() {
                if (!checkAvailability()) return null;
                try { const raw = localStorage.getItem(KEY); if (!raw) return null; return JSON.parse(raw); } catch (
                e) { console.error('Load failed:', e); return null; }
            }

            function clear() { if (!checkAvailability()) return; try { localStorage.removeItem(KEY); } catch (e) { /* no-op */ } }

            const AI_KEY = 'mcqGenerator.ai.v1';
            function saveAiSettings(settings) {
                if (!checkAvailability()) return false;
                try { localStorage.setItem(AI_KEY, JSON.stringify(settings)); return true; } catch (e) { return false; }
            }
            function loadAiSettings() {
                if (!checkAvailability()) return null;
                try { const raw = localStorage.getItem(AI_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
            }
            return { save, load, clear, checkAvailability, saveAiSettings, loadAiSettings };
        })();
