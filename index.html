        const DocRenderer = (() => {
            function escapeHtml(str) { const div = document.createElement('div');
                div.textContent = str; return div.innerHTML; }

            function renderHeaderHtml(doc, lang, setCode) {
                const hasMeta = !!(doc.title || doc.subtitle || doc.marks || doc.time);
                let html = '';
                if (setCode) html +=
                    `<div class="doc__setcode">${lang === 'bn' ? 'সেট' : 'Set'}: ${escapeHtml(setCode)}</div>`;
                const titleText = doc.title || (lang === 'bn' ? 'শিরোনাম' : 'Examination Title');
                html += `<div class="doc__title">${escapeHtml(titleText)}</div>`;
                const subtitleText = doc.subtitle || (lang === 'bn' ? 'উপশিরোনাম' : 'Subtitle');
                html += `<div class="doc__subtitle">${escapeHtml(subtitleText)}</div>`;
                const marksText = doc.marks || (lang === 'bn' ? '০' : '0');
                const timeText = doc.time || (lang === 'bn' ? '০ মিনিট' : '0 Minutes');
                html += `<div class="doc__metarow">
              <span>${lang === 'bn' ? 'মান' : 'Marks'}: ${escapeHtml(marksText)}</span>
              <span>${lang === 'bn' ? 'সময়' : 'Time'}: ${escapeHtml(timeText)}</span>
            </div>`;
                html += `<div class="doc__divider"></div>`;
                if (doc.note) {
                    html += `<div class="doc__note">${lang === 'bn' ? 'নোট' : 'Note'}: ${escapeHtml(doc.note)}</div>`;
                } else {
                    html +=
                        `<div class="doc__note" style="color:#9CA3AF;">${lang === 'bn' ? 'নোট যোগ করুন...' : 'Add a note...'}</div>`;
                }
                return html;
            }

            function renderQuestionHtml(q, index, lang) {
                const num = Utils.formatQuestionNumber(index, lang);
                const layout = q.optionsLayout || 'vertical';
                const layoutClass = `doc-options--${layout}`;
                let html = `<div class="doc-question">
              <div class="doc-question__text">
                <span class="doc-question__number">${num}.</span>
                <span class="doc-question__content">${q.question.html || ''}</span>
              </div>
              <div class="doc-options ${layoutClass}">`;
                q.options.forEach((opt, oi) => {
                    html += `<div class="doc-option">
                <span class="doc-option__label">${Utils.optionLabel(oi, lang)}</span>
                <span class="doc-option__content">${opt.html || ''}</span>
              </div>`;
                });
                html += `</div></div>`;
                return html;
            }

            function renderFullDocumentHtml(questions, setCode, doc, lang, fontStack, settings) {
                const hasQuestionContent = questions.some(q =>
                    Utils.stripHtml(q.question.html) !== '' || q.options.some(o => Utils.stripHtml(o.html) !== '')
                );
                let html =
                    `<div class="doc" data-doc-font="${lang}" style="font-family:${fontStack};font-size:${settings.fontSize}pt;color:${settings.fontColor};">`;
                html += renderHeaderHtml(doc, lang, setCode);
                if (!hasQuestionContent) {
                    html +=
                        `<div class="doc--empty-state">${lang === 'bn' ? 'প্রশ্ন যোগ করুন প্রিভিউ দেখতে...' : 'Add a question to see the live preview...'}</div>`;
                } else {
                    html += `<div class="doc__questions">`;
                    questions.forEach((q, i) => { html += renderQuestionHtml(q, i, lang); });
                    html += `</div>`;
                }
                html += `</div>`;
                return html;
            }

            function paginate(questions, setCode, doc, lang, fontStack, settings, pageSizeKey) {
                const dims = Preview.PAGE_SIZES_MM[pageSizeKey] || Preview.PAGE_SIZES_MM.A4;
                const MM_TO_PX = 96 / 25.4;
                const paddingMm = 18 * 2;
                const pageContentHeightPx = (dims.h - paddingMm) * MM_TO_PX;
                const headerHtml = renderHeaderHtml(doc, lang, setCode);
                const probe = document.createElement('div');
                probe.className = 'paper';
                probe.style.position = 'fixed';
                probe.style.left = '-99999px';
                probe.style.top = '0';
                probe.style.width = `${dims.w}mm`;
                probe.style.boxShadow = 'none';
                probe.style.height = 'auto';
                probe.style.minHeight = '0';
                document.body.appendChild(probe);
                const docWrap = document.createElement('div');
                docWrap.className = 'doc';
                docWrap.dataset.docFont = lang;
                docWrap.style.fontFamily = fontStack;
                docWrap.style.fontSize = `${settings.fontSize}pt`;
                docWrap.style.color = settings.fontColor;
                probe.appendChild(docWrap);
                docWrap.innerHTML = headerHtml;
                const headerHeightPx = docWrap.getBoundingClientRect().height;
                const questionsHost = document.createElement('div');
                questionsHost.className = 'doc__questions';
                docWrap.appendChild(questionsHost);

                function measureBlockHeight(questionSlice) {
                    questionsHost.innerHTML = questionSlice.map(({ q, index }) => renderQuestionHtml(q, index, lang))
                        .join('');
                    return questionsHost.getBoundingClientRect().height;
                }
                const pages = [];
                let remaining = questions.map((q, index) => ({ q, index }));
                let isFirst = true;
                while (remaining.length > 0) {
                    const budget = isFirst ? Math.max(pageContentHeightPx - headerHeightPx, pageContentHeightPx *
                        0.3) : pageContentHeightPx;
                    let lo = 1,
                        hi = remaining.length,
                        best = 1;
                    if (measureBlockHeight(remaining) <= budget) { best = remaining.length; } else {
                        while (lo <= hi) { const mid = Math.floor((lo + hi) / 2); const slice = remaining.slice(0,
                                mid); const h = measureBlockHeight(slice); if (h <= budget) { best = mid;
                                lo = mid + 1; } else { hi = mid - 1; } }
                        best = Math.max(best, 1);
                    }
                    pages.push({ questions: remaining.slice(0, best), isFirstPage: isFirst });
                    remaining = remaining.slice(best);
                    isFirst = false;
                }
                if (pages.length === 0) pages.push({ questions: [], isFirstPage: true });
                document.body.removeChild(probe);
                return pages.map(page => {
                    let html =
                        `<div class="doc" data-doc-font="${lang}" style="font-family:${fontStack};font-size:${settings.fontSize}pt;color:${settings.fontColor};">`;
                    if (page.isFirstPage) html += headerHtml;
                    if (page.questions.length > 0) {
                        html += `<div class="doc__questions">`;
                        page.questions.forEach(({ q, index }) => { html += renderQuestionHtml(q, index, lang); });
                        html += `</div>`;
                    } else {
                        html +=
                            `<div class="doc--empty-state">${lang === 'bn' ? 'প্রশ্ন যোগ করুন প্রিভিউ দেখতে...' : 'Add a question to see the live preview...'}</div>`;
                    }
                    html += `</div>`;
                    return html;
                });
            }
            return { renderFullDocumentHtml, renderHeaderHtml, renderQuestionHtml, paginate, escapeHtml };
        })();


        const Preview = (() => {
            const PAGE_SIZES_MM = { A4: { w: 210, h: 297 }, Letter: { w: 215.9, h: 279.4 }, Legal: { w: 215.9,
                    h: 355.6 } };
            const FONT_STACKS = {
                'Calibri': "'Calibri','Carlito',Arial,sans-serif",
                'Times New Roman': "'Times New Roman',Times,serif",
                'Cambria Math': "'Cambria Math','Cambria',serif",
                'Kalpurush': "'Kalpurush','Noto Serif Bengali',sans-serif",
                'Noto Serif Bengali': "'Noto Serif Bengali',serif",
                'Hind Siliguri': "'Hind Siliguri',sans-serif",
                'Shonar Bangla': "'Shonar Bangla','Noto Serif Bengali',sans-serif",
                'Nikosh BAN': "'Nikosh BAN','Noto Serif Bengali',sans-serif"
            };

            function currentQuestions() {
                const state = State.get();
                if (state.setCode.enabled && state.activeSetIndex >= 0 && state.generatedSets[state.activeSetIndex]) {
                    return state.generatedSets[state.activeSetIndex].questions;
                }
                return state.questions;
            }

            function currentSetCode() {
                const state = State.get();
                if (state.setCode.enabled && state.activeSetIndex >= 0 && state.generatedSets[state.activeSetIndex]) {
                    return state.generatedSets[state.activeSetIndex].setCode;
                }
                return null;
            }

            function applyPaperDimensions() {
                const state = State.get();
                const dims = PAGE_SIZES_MM[state.settings.pageSize] || PAGE_SIZES_MM.A4;
                document.querySelectorAll('#paperWrap .paper').forEach(paper => {
                    paper.style.width = `${dims.w}mm`;
                    paper.style.minHeight = `${dims.h}mm`;
                    paper.style.background = state.settings.pageColor || '#FFFFFF';
                });
            }

            function computeFitZoom() {
                const state = State.get();
                const dims = PAGE_SIZES_MM[state.settings.pageSize] || PAGE_SIZES_MM.A4;
                const container = document.getElementById('previewContainer');
                if (!container) return 100;
                const MM_TO_PX = 96 / 25.4;
                const paperW = dims.w * MM_TO_PX;
                const paperH = dims.h * MM_TO_PX;
                const cRect = container.getBoundingClientRect();
                const pad = 40;
                const availW = cRect.width - pad;
                const availH = cRect.height - pad;
                const scaleW = availW / paperW;
                const scaleH = availH / paperH;
                const fitScale = Math.min(scaleW, scaleH, 1.2);
                return Math.round(fitScale * 100);
            }

            function applyZoom() {
                const state = State.get();
                const fitZoom = state.settings.fitZoom || computeFitZoom();
                const zoom = state.settings.zoom;
                const scale = (zoom / 100) * (fitZoom / 100);
                const wrap = document.getElementById('paperWrap');
                wrap.style.transform = `scale(${scale})`;
                document.getElementById('zoomValue').textContent = `${zoom}%`;
            }

            function renderDocumentBody() {
                const state = State.get();
                const lang = state.language;
                const doc = state.document;
                const questions = currentQuestions();
                const setCode = currentSetCode();
                const fontStack = FONT_STACKS[state.settings.fontFamily] || FONT_STACKS['Times New Roman'];
                const dims = PAGE_SIZES_MM[state.settings.pageSize] || PAGE_SIZES_MM.A4;

                const hasQuestionContent = questions.some(q =>
                    Utils.stripHtml(q.question.html) !== '' || q.options.some(o => Utils.stripHtml(o.html) !== '')
                );
                const wrap = document.getElementById('paperWrap');

                let pageHtmlList;
                if (!hasQuestionContent) {
                    pageHtmlList = [DocRenderer.renderFullDocumentHtml(questions, setCode, doc, lang, fontStack, state
                        .settings)];
                } else {
                    pageHtmlList = DocRenderer.paginate(questions, setCode, doc, lang, fontStack, state.settings, state
                        .settings.pageSize);
                }

                wrap.innerHTML = pageHtmlList.map((pageHtml, i) =>
                    `<div class="paper" id="${i === 0 ? 'paper' : ''}" data-page="${i + 1}" role="img" aria-label="Question paper preview, page ${i + 1}">${pageHtml}</div>`
                ).join('');

                wrap.classList.toggle('paper-wrap--multipage', pageHtmlList.length > 1);

                if (pageHtmlList.length > 0) {
                    wrap.querySelectorAll('.paper').forEach((paperEl, i) => {
                        const footer = document.createElement('div');
                        footer.className = 'doc__pagenum';
                        const pageNum = i + 1;
                        const total = pageHtmlList.length;
                        if (lang === 'bn') {
                            footer.textContent =
                                `পৃষ্ঠা ${Utils.toBanglaNumber(pageNum)} / ${Utils.toBanglaNumber(total)}`;
                        } else {
                            footer.textContent =
                                `Page ${Utils.toEnglishNumber(pageNum)} / ${Utils.toEnglishNumber(total)}`;
                        }
                        paperEl.appendChild(footer);
                    });
                }

                applyPaperDimensions();

                const fit = computeFitZoom();
                state.settings.fitZoom = fit;
                if (state.settings.zoom === 100) {
                    const scale = fit / 100;
                    wrap.style.transform = `scale(${scale})`;
                    document.getElementById('zoomValue').textContent = `100%`;
                } else {
                    applyZoom();
                }

                const container = document.getElementById('previewContainer');
                if (container) container.scrollTop = 0;
            }

            function renderSetPicker() {
                const state = State.get();
                const wrap = document.getElementById('setSwitch');
                const select = document.getElementById('setPicker');
                if (!state.setCode.enabled || state.generatedSets.length === 0) { wrap.hidden = true; return; }
                wrap.hidden = false;
                select.innerHTML = state.generatedSets.map((s, i) =>
                    `<option value="${i}">${state.language === 'bn' ? 'সেট' : 'Set'} ${DocRenderer.escapeHtml(s.setCode)}</option>`
                ).join('');
                if (state.activeSetIndex < 0 || state.activeSetIndex >= state.generatedSets.length) {
                    state.activeSetIndex = 0;
                }
                select.value = String(state.activeSetIndex);
            }

            const update = Utils.debounce(() => { renderDocumentBody();
                renderSetPicker(); }, 60);

            function updateImmediate() { renderDocumentBody();
                renderSetPicker(); }

            return { update, updateImmediate, applyZoom, applyPaperDimensions, computeFitZoom, PAGE_SIZES_MM,
                FONT_STACKS, currentQuestions, currentSetCode };
        })();


        /* ================================================================
           RANDOMIZER
           ================================================================ */
        const Randomizer = (() => {
            function parseSetNames(raw, count) {
                const names = (raw || '').split(',').map(s => s.trim()).filter(Boolean);
                const result = [];
                for (let i = 0; i < count; i++) result.push(names[i] || String.fromCharCode(65 + i));
                return result;
            }

            function randomizeOptionsForQuestion(question) {
                const clone = Utils.clone(question);
                clone.options = Utils.shuffle(clone.options);
                return clone;
            }

            function buildSetQuestions(baseQuestions, randomizationType) {
                let questions = Utils.clone(baseQuestions);
                if (randomizationType === 'questions' || randomizationType === 'both') questions = Utils.shuffle(
                questions);
                if (randomizationType === 'options' || randomizationType === 'both') questions = questions.map(
                    randomizeOptionsForQuestion);
                return questions;
            }

            function generateSets() {
                const state = State.get();
                const count = Utils.clamp(parseInt(state.setCode.numberOfSets, 10) || 1, 1, 26);
                const names = parseSetNames(state.setCode.codeNames, count);
                const randType = state.setCode.randomization;
                const sets = names.map(name => ({ setCode: name, questions: buildSetQuestions(state.questions,
                        randType) }));
                state.generatedSets = sets;
                state.activeSetIndex = 0;
                return sets;
            }

            function clearSets() { const state = State.get();
                state.generatedSets = [];
                state.activeSetIndex = -1; }
            return { generateSets, clearSets, parseSetNames };
        })();


        /* ================================================================
           PDF GEN
           ================================================================ */
        const PdfGen = (() => {
            const PDF_RENDER_DPI_SCALE = 2.83;

            function checkDependencies() {
                const missing = [];
                if (!window.html2canvas) missing.push('html2canvas');
                if (!(window.jspdf && window.jspdf.jsPDF)) missing.push('jsPDF');
                return missing;
            }

            function buildOffscreenPage(pageHtml, pageColor) {
                const node = document.createElement('div');
                node.className = 'paper';
                node.style.position = 'fixed';
                node.style.left = '-99999px';
                node.style.top = '0';
                node.style.margin = '0';
                node.style.boxShadow = 'none';
                node.style.background = pageColor || '#FFFFFF';
                node.innerHTML = pageHtml;
                document.body.appendChild(node);
                return node;
            }

            async function rasterizePage(pageHtml, widthPx, heightPxMin, pageColor) {
                const node = buildOffscreenPage(pageHtml, pageColor);
                node.style.width = `${widthPx}px`;
                node.style.minHeight = `${heightPxMin}px`;
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                const actualHeight = Math.max(node.scrollHeight, heightPxMin);
                const canvas = await html2canvas(node, {
                    scale: PDF_RENDER_DPI_SCALE,
                    useCORS: true,
                    backgroundColor: pageColor || '#FFFFFF',
                    width: widthPx,
                    height: actualHeight,
                    windowWidth: widthPx
                });
                document.body.removeChild(node);
                return canvas;
            }

            async function generateSinglePdf(questions, setCode) {
                const missing = checkDependencies();
                if (missing.length) throw new Error(`${missing.join(' & ')} failed to load`);
                const state = State.get();
                const lang = state.language;
                const doc = state.document;
                const sizeKey = state.settings.pageSize;
                const dims = Preview.PAGE_SIZES_MM[sizeKey] || Preview.PAGE_SIZES_MM.A4;
                const fontStack = Preview.FONT_STACKS[state.settings.fontFamily] || Preview.FONT_STACKS['Times New Roman'];
                const unitFormat = sizeKey === 'A4' ? 'a4' : (sizeKey === 'Letter' ? 'letter' : 'legal');
                const MM_TO_PX = 96 / 25.4;
                const widthPx = Math.round(dims.w * MM_TO_PX);
                const heightPx = Math.round(dims.h * MM_TO_PX);
                const hasQuestionContent = questions.some(q =>
                    Utils.stripHtml(q.question.html) !== '' || q.options.some(o => Utils.stripHtml(o.html) !== '')
                );
                const pageHtmlList = hasQuestionContent ?
                    DocRenderer.paginate(questions, setCode, doc, lang, fontStack, state.settings, sizeKey) :
                    [DocRenderer.renderFullDocumentHtml(questions, setCode, doc, lang, fontStack, state.settings)];
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: unitFormat });
                for (let i = 0; i < pageHtmlList.length; i++) {
                    const canvas = await rasterizePage(pageHtmlList[i], widthPx, heightPx, state.settings.pageColor);
                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    const renderedHeightMm = (canvas.height / canvas.width) * dims.w;
                    if (i > 0) pdf.addPage(unitFormat, 'portrait');
                    pdf.addImage(imgData, 'JPEG', 0, 0, dims.w, Math.min(renderedHeightMm, dims.h), undefined, 'FAST');
                }
                return pdf;
            }

            function safeFileName(str) { return String(str || 'Document').replace(/[^a-z0-9\-_]+/gi, '_').slice(0, 60); }

            async function downloadDocument() {
                const state = State.get();
                const btn = document.getElementById('btnDownload');
                const labelEl = document.getElementById('btnDownloadLabel');
                const originalLabel = labelEl.textContent;
                btn.disabled = true;
                labelEl.textContent = 'Generating…';
                try {
                    const missing = checkDependencies();
                    if (missing.length) { throw new Error(
                            `Required library failed to load: ${missing.join(', ')}. Check your internet connection.`
                            ); }
                    const title = state.document.title || 'MCQ_Question_Paper';
                    const baseName = safeFileName(title);
                    if (state.setCode.enabled && state.generatedSets.length > 1) {
                        if (!window.JSZip) throw new Error('JSZip failed to load');
                        const zip = new JSZip();
                        for (const set of state.generatedSets) {
                            const pdf = await generateSinglePdf(set.questions, set.setCode);
                            const blob = pdf.output('blob');
                            zip.file(`MCQ_Set_${safeFileName(set.setCode)}.pdf`, blob);
                        }
                        const zipBlob = await zip.generateAsync({ type: 'blob' });
                        const zipName = `${baseName}_Sets.zip`;
                        const url = URL.createObjectURL(zipBlob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = zipName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 4000);
                        App.toast('ZIP with all sets generated successfully', 'success');
                    } else if (state.setCode.enabled && state.generatedSets.length === 1) {
                        const set = state.generatedSets[0];
                        const pdf = await generateSinglePdf(set.questions, set.setCode);
                        pdf.save(`MCQ_Set_${safeFileName(set.setCode)}.pdf`);
                        App.toast('PDF generated successfully', 'success');
                    } else {
                        const pdf = await generateSinglePdf(state.questions, null);
                        pdf.save(`${baseName}.pdf`);
                        App.toast('PDF generated successfully', 'success');
                    }
                } catch (err) {
                    console.error('PDF generation failed:', err);
                    App.toast('Unable to generate PDF. Please try again.', 'error');
                } finally { btn.disabled = false;
                    labelEl.textContent = originalLabel; }
            }
            return { downloadDocument };
        })();


        /* ================================================================
           STORAGE
           ================================================================ */
        const Storage = (() => {
            const KEY = 'mcqGenerator.project.v1';
            let available = true;

            function checkAvailability() {
                try { const testKey = '__mcq_storage_test__';
                    localStorage.setItem(testKey, '1');
                    localStorage.removeItem(testKey);
                    available = true; } catch (e) { available = false; }
                return available;
            }

            function save() {
                if (!checkAvailability()) { App.toast('Automatic saving is unavailable in this browser.', 'error'); return false; }
                try { const payload = JSON.stringify(State.get());
                    localStorage.setItem(KEY, payload); return true; } catch (e) { console.error('Save failed:', e);
                    App.toast('Unable to save your project.', 'error'); return false; }
            }

            function load() {
                if (!checkAvailability()) return null;
                try { const raw = localStorage.getItem(KEY); if (!raw) return null; return JSON.parse(raw); } catch (
                e) { console.error('Load failed:', e); return null; }
            }

            function clear() { if (!checkAvailability()) return; try { localStorage.removeItem(KEY); } catch (e) { /* no-op */ } }
            return { save, load, clear, checkAvailability };
        })();

        const Settings = (() => {
            const FONT_GROUPS = { en: ['Times New Roman', 'Calibri', 'Cambria Math'], bn: ['Kalpurush',
                    'Noto Serif Bengali', 'Hind Siliguri', 'Shonar Bangla', 'Nikosh BAN'
                ] };
            const PAGE_COLOR_PRESETS = [
                { name: 'White', hex: '#FFFFFF' }, { name: 'Ivory', hex: '#FFFFF0' },
                { name: 'Light Gray', hex: '#F3F4F6' }, { name: 'Light Blue', hex: '#EFF6FF' }
            ];

            function populateFontOptions() {
                const state = State.get();
                const select = document.getElementById('selFontFamily');
                const groupFonts = FONT_GROUPS[state.language] || FONT_GROUPS.en;
                select.innerHTML = groupFonts.map(f => `<option value="${f}">${f}</option>`).join('');
                if (groupFonts.includes(state.settings.fontFamily)) { select.value = state.settings.fontFamily; } else {

                    select.value = groupFonts[0]; }

            function buildColorPresets() {

                    `<button type="button" class="color-preset" style="background:${p.hex}" data-hex="${p.hex}" title="${p.name}" aria-label="${p.name}"></button>`
                ).join('');
                wrap.querySelectorAll('.color-preset').forEach(btn => {
                    btn.addEventListener('click', () => applyPageColor(btn.dataset.hex));
                });
            }

            function syncColorPresetActive() {
                const state = State.get();
                document.querySelectorAll('.color-preset').forEach(btn => {
                    btn.classList.toggle('is-active', btn.dataset.hex.toUpperCase() === state.settings.pageColor
                        .toUpperCase());

                document.getElementById('selPageColor').value = normalized;
                document.getElementById('selPageColorHex').value = normalized;
                syncColorPresetActive();
                Preview.update();

            function applyFontColor(hex) {
                const normalized = Utils.normalizeHex(hex);
                if (!normalized) return;
                State.setSetting('fontColor', normalized);
                document.getElementById('selFontColor').value = normalized;
                document.getElementById('selFontColorHex').value = normalized;
                Preview.update();

            function settingsTriggerButtons() {
                return [document.getElementById('btnSettings'), document.getElementById('btnSettingsInput')]
                    .filter(Boolean);
            }

            function openDrawer() {

                document.getElementById('settingsDrawer').setAttribute('aria-hidden', 'false');
                document.getElementById('drawerOverlay').hidden = false;
                settingsTriggerButtons().forEach(btn => {
                    btn.setAttribute('aria-expanded', 'true');
                    btn.classList.add('is-active');
                });

            function closeDrawer() {
                document.getElementById('settingsDrawer').classList.remove('is-open');
                document.getElementById('settingsDrawer').setAttribute('aria-hidden', 'true');
                document.getElementById('drawerOverlay').hidden = true;
                settingsTriggerButtons().forEach(btn => {
                    btn.setAttribute('aria-expanded', 'false');
                    btn.classList.remove('is-active');
                });

            function syncFormFromState() {
                const state = State.get();
                document.querySelectorAll('.segmented__btn[data-theme]').forEach(btn => {
                    btn.classList.toggle('is-active', btn.dataset.theme === state.settings.theme);
                });
                document.getElementById('selPageSize').value = state.settings.pageSize;
                document.getElementById('selPageColor').value = state.settings.pageColor;
                document.getElementById('selPageColorHex').value = state.settings.pageColor;
                syncColorPresetActive();
                populateFontOptions();
                document.getElementById('selFontSize').value = String(state.settings.fontSize);
                document.getElementById('selFontColor').value = state.settings.fontColor;
                document.getElementById('selFontColorHex').value = state.settings.fontColor;
                document.getElementById('chkSetCode').checked = state.setCode.enabled;
                document.getElementById('setCodeOptions').hidden = !state.setCode.enabled;
                document.getElementById('selNumSets').value = String(state.setCode.numberOfSets);

            function bindEvents() {

                const btnSettingsInput = document.getElementById('btnSettingsInput');
                if (btnSettingsInput) btnSettingsInput.addEventListener('click', openDrawer);
                document.getElementById('btnCloseSettings').addEventListener('click', closeDrawer);
                document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
                document.querySelectorAll('.segmented__btn[data-theme]').forEach(btn => {
                    btn.addEventListener('click', () => { const theme = btn.dataset.theme;
                        State.setSetting('theme', theme);
                        document.documentElement.setAttribute('data-theme', theme);
                        document.querySelectorAll('.segmented__btn[data-theme]').forEach(b => b.classList
                            .toggle('is-active', b === btn)); });
                });
                document.getElementById('selPageSize').addEventListener('change', (e) => { State.setSetting(
                        'pageSize', e.target.value);
                    Preview.update(); });
                document.getElementById('selPageColor').addEventListener('input', (e) => applyPageColor(e.target
                .value));
                document.getElementById('selPageColorHex').addEventListener('change', (e) => applyPageColor(e.target
                    .value));
                document.getElementById('selFontFamily').addEventListener('change', (e) => { State.setSetting(
                        'fontFamily', e.target.value);
                    Preview.update(); });
                document.getElementById('selFontSize').addEventListener('change', (e) => { State.setSetting(
                        'fontSize', parseInt(e.target.value, 10));
                    Preview.update(); });
                document.getElementById('selFontColor').addEventListener('input', (e) => applyFontColor(e.target
                .value));
                document.getElementById('selFontColorHex').addEventListener('change', (e) => applyFontColor(e.target
                    .value));
                document.getElementById('chkSetCode').addEventListener('change', (e) => {
                    State.setSetCodeField('enabled', e.target.checked);
                    document.getElementById('setCodeOptions').hidden = !e.target.checked;
                    if (!e.target.checked) { Randomizer.clearSets();
                        document.getElementById('setGenStatus').textContent = ''; }
                    Preview.update();
                });
                document.getElementById('selNumSets').addEventListener('change', (e) => { State.setSetCodeField(
                        'numberOfSets', parseInt(e.target.value, 10)); });
                document.getElementById('inpSetNames').addEventListener('input', Utils.debounce((e) => { State
                        .setSetCodeField('codeNames', e.target.value); }, 200));
                document.getElementById('selRandomType').addEventListener('change', (e) => { State.setSetCodeField(
                        'randomization', e.target.value); });
                document.getElementById('btnGenerateSets').addEventListener('click', () => {
                    const state = State.get();
                    const hasContent = state.questions.some(q => Utils.stripHtml(q.question.html) !== '');
                    if (!hasContent) { document.getElementById('setGenStatus').textContent =
                            'Add at least one question before generating sets.'; return; }
                    Randomizer.generateSets();
                    Preview.update();
                    const count = state.generatedSets.length;
                    document.getElementById('setGenStatus').textContent =
                        `${count} set${count === 1 ? '' : 's'} generated successfully.`;
                    App.toast(`${count} set${count === 1 ? '' : 's'} generated`, 'success');
                });
                document.getElementById('setPicker').addEventListener('change', (e) => { State.get().activeSetIndex =
                        parseInt(e.target.value, 10);
                    Preview.updateImmediate(); });
                document.getElementById('btnDrawerSave').addEventListener('click', () => App.handleSave());
                document.getElementById('btnDrawerReset').addEventListener('click', () => App.requestReset());
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && document.getElementById('settingsDrawer').classList.contains(
                            'is-open')) closeDrawer();
                });
            }
            return { bindEvents, syncFormFromState, buildColorPresets, populateFontOptions, openDrawer,
            closeDrawer };
        })();


        /* ================================================================
           APP
           ================================================================ */
        const App = (() => {
            function toast(message, type = 'default') {
                const container = document.getElementById('toastContainer');
                const el = document.createElement('div');
                el.className =
                    `toast${type === 'error' ? ' toast--error' : type === 'success' ? ' toast--success' : ''}`;
                const icon = type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info';
                el.innerHTML = `<i data-lucide="${icon}"></i><span>${escapeText(message)}</span>`;
                container.appendChild(el);
                if (window.lucide) lucide.createIcons();
                setTimeout(() => { el.classList.add('is-leaving');
                    setTimeout(() => el.remove(), 200); }, 2600);
            }

            function escapeText(str) { const div = document.createElement('div');
                div.textContent = str; return div.innerHTML; }

            function requestReset() {
                State.resetToDefault();
                const s = State.get();
                s.language = 'en';
                s.settings.pageSize = 'A4';
                s.settings.pageColor = '#FFFFFF';
                s.settings.zoom = 100;
                s.settings.fontFamily = 'Times New Roman';
                s.questions = [State.freshQuestion()];
                Storage.clear();
                fullRerender();
                toast('Document reset to defaults', 'success');

            function requestDeleteQuestion(id) {
                const state = State.get();
                if (state.questions.length === 1) {
                    State.updateQuestionHtml(id, '');
                    state.questions[0].options.forEach(o => o.html = '');
                    Editor.renderQuestions();
                    Preview.update();
                    toast('Question cleared', 'success');
                    return;
                }
                State.deleteQuestion(id);
                Editor.renderQuestions();
                Preview.update();

            function bindAddQuestion() {

                    const lastCard = cards[cards.length - 1];
                    if (lastCard) { lastCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        const firstEditor = lastCard.querySelector('.editor-area'); if (firstEditor)
                            setTimeout(() => firstEditor.focus(), 260); }
                    const state = State.get();
                    const num = Utils.toEnglishNumber(state.questions.length);
                    toast(`Question ${num} added`, 'success');
                });
            }

            function bindHeaderActions() {
                document.getElementById('btnSave').addEventListener('click', handleSave);
                document.getElementById('btnReset').addEventListener('click', requestReset);
            }

            function bindDownload() {
                document.getElementById('btnDownload').addEventListener('click', () => { PdfGen.downloadDocument(); });
            }

            function bindLanguageSwitch() {
                document.querySelectorAll('.lang-switch__btn').forEach(btn => {
                    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
                });
            }

            function fullRerender() {
                const state = State.get();
                document.body.setAttribute('data-doc-lang', state.language);
                document.documentElement.setAttribute('data-theme', state.settings.theme);
                document.querySelectorAll('.lang-switch__btn').forEach(btn => {
                    btn.classList.toggle('is-active', btn.dataset.lang === state.language);
                });
                applyPlaceholders(state.language);
                syncDocumentFieldsFromState();
                Settings.syncFormFromState();
                Editor.renderQuestions();
                Preview.updateImmediate();

                const container = document.getElementById('previewContainer');
                const pageSize = state.settings.pageSize;
                const dims = Preview.PAGE_SIZES_MM[pageSize] || Preview.PAGE_SIZES_MM.A4;
                container.style.aspectRatio = `${dims.w} / ${dims.h}`;

                const fit = Preview.computeFitZoom();
                state.settings.fitZoom = fit;
                state.settings.zoom = 100;
                const wrap = document.getElementById('paperWrap');
                wrap.style.transform = `scale(${fit / 100})`;
                document.getElementById('zoomValue').textContent = `100%`;

                if (window.lucide) lucide.createIcons();
            }

            function init() {
                const saved = Storage.load();
                if (saved) { const merged = Object.assign(State.defaultState(), saved);
                    State.replaceAll(merged); }

                const state = State.get();
                const dims = Preview.PAGE_SIZES_MM[state.settings.pageSize] || Preview.PAGE_SIZES_MM.A4;
                const container = document.getElementById('previewContainer');
                if (container) container.style.aspectRatio = `${dims.w} / ${dims.h}`;

                Settings.buildColorPresets();
                Editor.initToolbar();
                bindDocumentFields();
                bindZoomControls();
                bindMobileTabs();
                bindAddQuestion();
                bindHeaderActions();
                bindDownload();
                bindLanguageSwitch();
                Settings.bindEvents();
                fullRerender();
                if (saved) toast('Restored your saved project', 'default');
                if (window.lucide) lucide.createIcons();

                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(Utils.debounce(() => {
                        const s = State.get();
                        const fit = Preview.computeFitZoom();
                        s.settings.fitZoom = fit;
                        if (s.settings.zoom === 100) {
                            const wrap = document.getElementById('paperWrap');
                            wrap.style.transform = `scale(${fit / 100})`;
                        }
                    }, 200));
                    const containerEl = document.getElementById('previewContainer');
                    if (containerEl) ro.observe(containerEl);
                }
            }
            document.addEventListener('DOMContentLoaded', init);
            return { toast, requestReset, requestDeleteQuestion, handleSave };
        })();
    </script>

</body>
</html>
