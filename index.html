        /* ================================================================
           AI (Google Gemini) — capture / upload / generate MCQs
           ================================================================ */
        const AiGenerator = (() => {
            const MAX_FILES = 10;
            // Gemini's inline_data requests (the method this app uses — files
            // sent directly inside the generateContent JSON body) currently
            // cap the total request size at 100MB. Base64 encoding inflates
            // raw file bytes by ~33%, and free-tier keys in particular can
            // reject requests well before that hard ceiling, so a bit of
            // headroom is kept and the check runs per-file so a mix of
            // several files reliably stays inside budget when added together
            // (checked again below, on the combined total).
            const MAX_INLINE_TOTAL_MB = 100;
            const SAFE_TOTAL_BUDGET_MB = 60; // headroom under the 100MB ceiling
            const BASE64_INFLATION = 1.37;
            // Each entry: { id, name, kind: 'image'|'pdf'|'text', mimeType, data (base64, for image/pdf),
            //               text (extracted plain text, for docx/pptx), thumb (data URL, for images),
            //               progress (0-100, upload/read progress), done (bool), rawSizeBytes }
            let capturedFiles = [];
            let customPromptMode = false;

            function el(id) { return document.getElementById(id); }

            function genId() { return `f_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`; }

            function formatMb(bytes) { return (bytes / (1024 * 1024)).toFixed(1); }

            // Estimated size this file will occupy inside the Gemini request
            // once base64-encoded — the number that actually matters for the
            // inline size ceiling, not the raw file size on disk.
            function estimatedInlineMb(rawBytes) {
                return (rawBytes * BASE64_INFLATION) / (1024 * 1024);
            }

            // Combined estimated inline size of every image/pdf file already
            // captured — text files (docx/pptx, sent as plain text) don't
            // count toward this, since they aren't inline_data.
            function currentInlineMb() {
                return capturedFiles
                    .filter(f => (f.kind === 'image' || f.kind === 'pdf') && f.rawSizeBytes)
                    .reduce((sum, f) => sum + estimatedInlineMb(f.rawSizeBytes), 0);
            }

            function resetStage() {
                capturedFiles = [];
                el('aiCapturePlaceholder').hidden = false;
                renderFileList();
                setStatus('');
            }

            function applyCustomPromptMode(on) {
                customPromptMode = on;
                el('chkAiCustomPrompt').checked = on;
                el('aiModalBody').classList.toggle('is-custom-prompt-mode', on);
                el('aiPromptLabel').textContent = on ?
                    'Subject / Topic + Instruction' :
                    'Instruction for MCQ Generation';
                el('aiPromptInput').placeholder = on ?
                    'e.g. "Photosynthesis, class 9 biology — generate 20 medium-difficulty MCQs with explanations."' :
                    'Generate 30 MCQs from this page, medium difficulty, include the correct answer and explanation.';
                const keyHintVisible = !el('aiKeyHint').hidden;
                setStatus('');
                if (keyHintVisible) el('aiKeyHint').hidden = false;
            }

            function setStatus(message, tone = 'default') {
                const statusEl = el('aiStatus');
                statusEl.classList.toggle('is-error', tone === 'error');
                if (!message) { statusEl.innerHTML = ''; return; }
                if (tone === 'loading') {
                    statusEl.innerHTML = `<span class="ai-spinner"></span><span>${escapeHtml(message)}</span>`;
                } else {
                    statusEl.textContent = message;
                }
            }

            function escapeHtml(str) { const d = document.createElement('div');
                d.textContent = str; return d.innerHTML; }

            function openDeviceCamera() {
                if (capturedFiles.length >= MAX_FILES) {
                    setStatus(`You can attach up to ${MAX_FILES} files.`, 'error');
                    return;
                }
                el('aiCameraInput').click();
            }

            // capturedFiles entries carry a `progress` (0-100) that drives the ring
            // shown over each chip's icon/thumbnail while the file is being read.
            function addPlaceholderFile(name, kind, mimeType) {
                const entry = { id: genId(), name, kind, mimeType, data: null, thumb: null, progress: 0, done: false };
                capturedFiles.push(entry);
                el('aiCapturePlaceholder').hidden = true;
                renderFileList();
                return entry;
            }

            function updateFileProgress(id, progress) {
                const f = capturedFiles.find(x => x.id === id);
                if (!f) return;
                f.progress = Math.max(0, Math.min(100, progress));
                updateChipProgress(id, f.progress);
            }

            function finishFile(id, data) {
                const f = capturedFiles.find(x => x.id === id);
                if (!f) return;
                Object.assign(f, data, { progress: 100, done: true });
                renderFileList();
            }

            function addImageFile(dataUrl, mimeType, name, existingId) {
                const base64 = dataUrl.split(',')[1];
                if (existingId) {
                    finishFile(existingId, { kind: 'image', mimeType, data: base64, thumb: dataUrl });
                } else {
                    capturedFiles.push({ id: genId(), name, kind: 'image', mimeType, data: base64, thumb: dataUrl, progress: 100, done: true });
                    el('aiCapturePlaceholder').hidden = true;
                    renderFileList();
                }
            }

            function addPdfFile(dataUrl, name, existingId) {
                const base64 = dataUrl.split(',')[1];
                if (existingId) {
                    finishFile(existingId, { kind: 'pdf', mimeType: 'application/pdf', data: base64 });
                } else {
                    capturedFiles.push({ id: genId(), name, kind: 'pdf', mimeType: 'application/pdf', data: base64, progress: 100, done: true });
                    el('aiCapturePlaceholder').hidden = true;
                    renderFileList();
                }
            }

            function addTextFile(text, name, kind, existingId) {
                if (existingId) {
                    finishFile(existingId, { kind: 'text', sourceKind: kind, text });
                } else {
                    capturedFiles.push({ id: genId(), name, kind: 'text', sourceKind: kind, text, progress: 100, done: true });
                    el('aiCapturePlaceholder').hidden = true;
                    renderFileList();
                }
            }

            // docx/pptx are ZIP archives of XML - JSZip lets us pull the raw
            // text out client-side without any extra library. JSZip is now
            // lazy-loaded (see PdfGen) rather than always present, so it's
            // fetched here on demand too — this resolves immediately if a
            // download elsewhere in the session already loaded it.
            async function extractOfficeText(file) {
                await PdfGen.ensureZipLoaded();
                if (!window.JSZip) throw new Error('JSZip failed to load');
                const zip = await JSZip.loadAsync(file);
                const isPptx = /\.pptx$/i.test(file.name);
                const xmlPaths = Object.keys(zip.files).filter(p =>
                    isPptx ? /^ppt\/slides\/slide\d+\.xml$/i.test(p) : /^word\/document\.xml$/i.test(p)
                );
                if (isPptx) {
                    xmlPaths.sort((a, b) => {
                        const na = parseInt(a.match(/slide(\d+)\.xml/i)[1], 10);
                        const nb = parseInt(b.match(/slide(\d+)\.xml/i)[1], 10);
                        return na - nb;
                    });
                }
                if (xmlPaths.length === 0) throw new Error('EMPTY_DOC');
                const chunks = [];
                for (const path of xmlPaths) {
                    const xml = await zip.files[path].async('string');
                    // Pull text out of <a:t> (pptx) / <w:t> (docx) runs, and turn
                    // paragraph/slide boundaries into line breaks so structure survives.
                    const text = xml
                        .replace(/<\/w:p>/gi, '\n')
                        .replace(/<\/a:p>/gi, '\n')
                        .replace(/<[^>]+>/g, '')
                        .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
                        .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
                        .replace(/[ \t]{2,}/g, ' ')
                        .replace(/\n{3,}/g, '\n\n')
                        .trim();
                    if (text) chunks.push(text);
                }
                const combined = chunks.join('\n\n').trim();
                if (!combined) throw new Error('EMPTY_DOC');
                return combined;
            }

            function handleFileSelected(fileList) {
                const files = Array.from(fileList || []);
                if (files.length === 0) return;
                const room = MAX_FILES - capturedFiles.length;
                if (room <= 0) {
                    setStatus(`You can attach up to ${MAX_FILES} files. Remove one first.`, 'error');
                    return;
                }
                const toProcess = files.slice(0, room);
                if (files.length > toProcess.length) {
                    setStatus(`Only ${room} more file${room === 1 ? '' : 's'} can be added (max ${MAX_FILES}).`, 'error');
                }
                el('aiCapturePlaceholder').hidden = true;
                toProcess.forEach(file => processFile(file));
            }

            function processFile(file) {
                const isImage = file.type.startsWith('image/');
                const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
                const isDocx = /\.docx$/i.test(file.name) ||
                    file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
                const isPptx = /\.pptx$/i.test(file.name) ||
                    file.type === 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
                const isLegacyOffice = /\.(doc|ppt|xls|xlsx)$/i.test(file.name);

                if (isLegacyOffice) {
                    setStatus('Older .doc/.ppt/.xls formats aren\u2019t supported — please save as .docx/.pptx/PDF and try again.', 'error');
                    return;
                }
                if (!isImage && !isPdf && !isDocx && !isPptx) {
                    setStatus('Please choose an image, PDF, DOCX, or PPTX file.', 'error');
                    return;
                }

                // Images and PDFs are sent as inline_data (base64 inside the
                // request JSON) — check the size budget before reading the
                // file at all, so oversized files never even start uploading
                // and the person gets a clear reason immediately instead of
                // a vague failure from Gemini after a long wait.
                if (isImage || isPdf) {
                    const thisFileMb = estimatedInlineMb(file.size);
                    if (thisFileMb > SAFE_TOTAL_BUDGET_MB) {
                        setStatus(
                            `"${file.name}" is too large (~${formatMb(file.size)}MB). Please use a file under ~${Math.floor(SAFE_TOTAL_BUDGET_MB / BASE64_INFLATION)}MB, or split it into smaller files.`,
                            'error');
                        return;
                    }
                    const combinedMb = currentInlineMb() + thisFileMb;
                    if (combinedMb > SAFE_TOTAL_BUDGET_MB) {
                        setStatus(
                            `Adding "${file.name}" would push your attached files over the size limit for one request. Remove a file or use smaller ones.`,
                            'error');
                        return;
                    }
                }

                const kindLabel = isImage ? 'image' : isPdf ? 'pdf' : 'text';
                const entry = addPlaceholderFile(file.name, kindLabel, file.type);
                entry.rawSizeBytes = file.size;

                if (isDocx || isPptx) {
                    // JSZip gives no native progress, so ease the ring forward while it works
                    // and let it complete to 100 only once extraction actually finishes.
                    let simulated = 0;
                    const ticker = setInterval(() => {
                        simulated = Math.min(simulated + Math.random() * 12 + 4, 90);
                        updateFileProgress(entry.id, simulated);
                    }, 140);
                    extractOfficeText(file).then(text => {
                        clearInterval(ticker);
                        addTextFile(text, file.name, isPptx ? 'pptx' : 'docx', entry.id);
                    }).catch(err => {
                        clearInterval(ticker);
                        console.error(err);
                        removeFile(entry.id);
                        setStatus(`Couldn\u2019t read ${file.name} — the file may be empty, corrupted, or password-protected.`, 'error');
                    });
                    return;
                }

                const reader = new FileReader();
                reader.onprogress = (e) => {
                    if (e.lengthComputable) updateFileProgress(entry.id, (e.loaded / e.total) * 100);
                };
                reader.onload = () => {
                    if (isPdf) { addPdfFile(reader.result, file.name, entry.id); }
                    else { addImageFile(reader.result, file.type || 'image/jpeg', file.name, entry.id); }
                };
                reader.onerror = () => {
                    removeFile(entry.id);
                    setStatus(`Could not read ${file.name}.`, 'error');
                };
                reader.readAsDataURL(file);
            }

            function removeFile(id) {
                capturedFiles = capturedFiles.filter(f => f.id !== id);
                renderFileList();
                if (capturedFiles.length === 0) el('aiCapturePlaceholder').hidden = false;
            }

            function fileIcon(f) {
                if (f.kind === 'image') return null; // uses thumbnail instead
                if (f.kind === 'pdf') return 'file-text';
                if (f.sourceKind === 'pptx') return 'presentation';
                return 'file-type-2';
            }

            // r=15 circle => circumference ≈ 94.25; dashoffset counts down as progress rises.
            const RING_R = 15;
            const RING_CIRC = 2 * Math.PI * RING_R;

            function progressRingSvg(progress) {
                const offset = RING_CIRC * (1 - Math.max(0, Math.min(100, progress)) / 100);
                return `<svg class="ai-file-chip__ring" viewBox="0 0 34 34" aria-hidden="true">
                    <circle class="ai-file-chip__ring-track" cx="17" cy="17" r="${RING_R}"></circle>
                    <circle class="ai-file-chip__ring-fill" cx="17" cy="17" r="${RING_R}"
                        stroke-dasharray="${RING_CIRC}" stroke-dashoffset="${offset}"></circle>
                </svg>`;
            }

            // Lightweight update used during upload/read — moves the ring without
            // touching the rest of the DOM (icons, remove buttons, etc.).
            function updateChipProgress(id, progress) {
                const chip = document.querySelector(`.ai-file-chip[data-id="${id}"]`);
                if (!chip) return;
                const fillCircle = chip.querySelector('.ai-file-chip__ring-fill');
                if (fillCircle) {
                    const offset = RING_CIRC * (1 - Math.max(0, Math.min(100, progress)) / 100);
                    fillCircle.setAttribute('stroke-dashoffset', offset);
                }
                const pctEl = chip.querySelector('.ai-file-chip__pct');
                if (pctEl) pctEl.textContent = `${Math.round(progress)}%`;
            }

            function renderFileList() {
                const wrap = el('aiFileList');
                const items = el('aiFileListItems');
                const title = el('aiCaptureTitle');
                if (capturedFiles.length === 0) {
                    wrap.hidden = true;
                    items.innerHTML = '';
                    if (title) title.textContent = 'No file selected';
                    return;
                }
                wrap.hidden = false;
                if (title) title.textContent = `${capturedFiles.length} file${capturedFiles.length === 1 ? '' : 's'} selected`;
                items.innerHTML = capturedFiles.map(f => {
                    const iconName = fileIcon(f);
                    const iconHtml = !f.done ? '' :
                        (f.kind === 'image' ?
                            `<img src="${f.thumb}" alt="">` :
                            `<i data-lucide="${iconName}"></i>`);
                    const metaText = !f.done ? 'Uploading…' :
                        (f.kind === 'text' ?
                            (f.sourceKind === 'pptx' ? 'PowerPoint · text extracted' : 'Word · text extracted') :
                            (f.kind === 'pdf' ? 'PDF' : 'Image'));
                    const progressHtml = !f.done ?
                        `${progressRingSvg(f.progress || 0)}<span class="ai-file-chip__pct">${Math.round(f.progress || 0)}%</span>` :
                        '';
                    return `<div class="ai-file-chip${!f.done ? ' is-uploading' : ''}" data-id="${f.id}">
                        <div class="ai-file-chip__icon">${iconHtml}${progressHtml}</div>
                        <div class="ai-file-chip__info">
                            <span class="ai-file-chip__name">${escapeHtml(f.name)}</span>
                            <span class="ai-file-chip__meta">${metaText}</span>
                        </div>
                        <button type="button" class="ai-file-chip__remove" data-remove="${f.id}" aria-label="Remove ${escapeHtml(f.name)}"><i data-lucide="x"></i></button>
                    </div>`;
                }).join('');
                items.querySelectorAll('[data-remove]').forEach(btn => {
                    btn.addEventListener('click', () => removeFile(btn.dataset.remove));
                });
                if (window.lucide) lucide.createIcons();
            }

            function openModal({ startCameraImmediately } = {}) {
                resetStage();
                applyCustomPromptMode(false);
                const settings = Settings.getAiSettings();
                el('aiKeyHint').hidden = !!settings.apiKey;
                el('aiModalOverlay').hidden = false;
                if (window.lucide) lucide.createIcons();
                if (startCameraImmediately) openDeviceCamera();
            }

            function closeModal() {
                el('aiModalOverlay').hidden = true;
            }

            function buildCustomPrompt(userPrompt) {
                const instruction = `You are an expert exam-question writer with broad, up-to-date knowledge across academic subjects and general topics. The user has NOT attached any file, image, or document — instead they have named a subject/topic and given an instruction below. Use your own knowledge (as if researching the topic) to write accurate, well-sourced multiple-choice questions (MCQs) about it.

User's request: "${userPrompt}"

Respond with ONLY valid JSON (no markdown fences, no commentary) matching exactly this schema:
{
  "questions": [
    {
      "question": "question text (plain text, using real math symbols as described below)",
      "options": ["option A text", "option B text", "option C text", "option D text"],
      "correctIndex": 0,
      "explanation": "brief explanation of the correct answer"
    }
  ]
}
Rules:
- Identify the subject/topic from the user's request and write factually accurate questions about it, as a knowledgeable expert or well-researched source would.
- Write the question and options in the same language the user wrote their request in (English or Bangla), unless the request explicitly asks for a different language.
- Always produce exactly 4 options per question unless the user's request specifies a different number of options.
- correctIndex is a zero-based index (0-3) pointing to the correct option.
- Vary question difficulty and phrasing so questions don't feel repetitive; cover different facets of the topic.
- If the user's request is too vague to identify any real subject/topic, still do your best to produce reasonable general-knowledge questions related to whatever terms were given.
- MATH FORMATTING - this is important: never use plain-text notation like x^2, sqrt(x), x_2, or ->. Instead use the actual Unicode characters directly in the text:
  - Superscripts/powers: ² ³ ⁴ (e.g. write "x²" not "x^2")
  - Subscripts: ₂ ₃ (e.g. write "H₂O" not "H_2O")
  - Roots: √ ∛ (e.g. "√x" not "sqrt(x)")
  - Fractions: ½ ⅓ ¼ ⅔ ¾ ⅕ ⅖ ⅗ ⅘ ⅙ ⅚ ⅛ ⅜ ⅝ ⅞ where they fit, otherwise write as "a/b"
  - Operators/comparisons: × ÷ ± ≈ ≠ ≤ ≥ ∝ ∑ ∫ ∞ →  ⇌ · °
  - Greek letters: α β γ δ θ λ μ π Ω Δ ∂ ∇
  - If an exponent or subscript is not one of ² ³ ⁴ ₂ ₃ (e.g. a variable exponent like x^n), write it in parentheses like "x^(n)" as a fallback, but always prefer a real Unicode character when one exists.
- Return ONLY the JSON object, nothing else.`;
                return instruction;
            }

            function buildPrompt(userPrompt) {
                if (customPromptMode) return buildCustomPrompt(userPrompt);
                const kinds = new Set(capturedFiles.map(f => f.kind === 'text' ? f.sourceKind : f.kind));
                const parts = [];
                if (kinds.has('image')) parts.push('image(s) of a page');
                if (kinds.has('pdf')) parts.push('PDF document(s)');
                if (kinds.has('docx')) parts.push('Word document text');
                if (kinds.has('pptx')) parts.push('PowerPoint slide text');
                const sourceDesc = capturedFiles.length > 1 ?
                    `attached ${parts.join(', ')} (${capturedFiles.length} files total)` :
                    `attached ${parts[0] || 'source material'}`;
                const textFiles = capturedFiles.filter(f => f.kind === 'text');
                const textBlock = textFiles.length ? `

Extracted document text follows (use this together with any attached images/PDFs above):
` + textFiles.map(f => `--- ${f.name} ---
${f.text}`).join('\n\n') : '';
                const instruction = `You are an expert exam-question writer. Look at the ${sourceDesc} (it may contain English text, Bangla (Bengali) text, or mathematical content/equations). Based on the content across ALL attached sources and the user's request below, generate multiple-choice questions (MCQs).

User's request: "${userPrompt}"${textBlock}

Respond with ONLY valid JSON (no markdown fences, no commentary) matching exactly this schema:
{
  "questions": [
    {
      "question": "question text (plain text, using real math symbols as described below)",
      "options": ["option A text", "option B text", "option C text", "option D text"],
      "correctIndex": 0,
      "explanation": "brief explanation of the correct answer"
    }
  ]
}
Rules:
- Write the question and options in the same language as the source content (English or Bangla), unless the user's request explicitly asks for a different language.
- Always produce exactly 4 options per question unless the user's request specifies a different number of options.
- correctIndex is a zero-based index (0-3) pointing to the correct option.
- Base every question strictly on content visible in the source(s). If multiple files were attached, draw questions from across all of them.
- MATH FORMATTING - this is important: never use plain-text notation like x^2, sqrt(x), x_2, or ->. Instead use the actual Unicode characters directly in the text:
  - Superscripts/powers: ² ³ ⁴ (e.g. write "x²" not "x^2")
  - Subscripts: ₂ ₃ (e.g. write "H₂O" not "H_2O")
  - Roots: √ ∛ (e.g. "√x" not "sqrt(x)")
  - Fractions: ½ ⅓ ¼ ⅔ ¾ ⅕ ⅖ ⅗ ⅘ ⅙ ⅚ ⅛ ⅜ ⅝ ⅞ where they fit, otherwise write as "a/b"
  - Operators/comparisons: × ÷ ± ≈ ≠ ≤ ≥ ∝ ∑ ∫ ∞ →  ⇌ · °
  - Greek letters: α β γ δ θ λ μ π Ω Δ ∂ ∇
  - If an exponent or subscript is not one of ² ³ ⁴ ₂ ₃ (e.g. a variable exponent like x^n), write it in parentheses like "x^(n)" as a fallback, but always prefer a real Unicode character when one exists.
- Return ONLY the JSON object, nothing else.`;
                return instruction;
            }

            // Known-good model IDs to fall back through, in order, if the chosen model
            // has been retired ("no longer available to new users" / 404 NOT_FOUND).
            const FALLBACK_MODELS = ['gemini-3-flash-preview', 'gemini-3.1-flash-lite', 'gemini-2.5-flash-lite', 'gemini-2.0-flash'];

            async function requestGeneration(model, userPrompt, onUploadProgress) {
                const settings = Settings.getAiSettings();
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(settings.apiKey)}`;
                const inlineParts = capturedFiles
                    .filter(f => f.kind === 'image' || f.kind === 'pdf')
                    .map(f => ({ inline_data: { mime_type: f.mimeType, data: f.data } }));
                const body = {
                    contents: [{
                        parts: [
                            { text: buildPrompt(userPrompt) },
                            ...inlineParts
                        ]
                    }],
                    generationConfig: { temperature: 0.4, responseMimeType: 'application/json' }
                };

                // fetch() gives no visibility into how much of the request
                // body has actually gone out over the network — for a large
                // inline PDF/image that upload can take a real amount of
                // time, so XMLHttpRequest is used here instead, since it's
                // the only way in a browser to get real upload progress
                // events (upload.onprogress) rather than a static "please
                // wait" message.
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', url, true);
                    xhr.setRequestHeader('Content-Type', 'application/json');

                    if (xhr.upload && onUploadProgress) {
                        xhr.upload.onprogress = (e) => {
                            if (e.lengthComputable) onUploadProgress(e.loaded / e.total);
                        };
                    }

                    xhr.onload = () => {
                        let json = null;
                        try { json = JSON.parse(xhr.responseText); } catch (e) { /* handled below */ }

                        if (xhr.status >= 200 && xhr.status < 300) {
                            if (onUploadProgress) onUploadProgress(1);
                            resolve(json || {});
                            return;
                        }

                        let msg = `Request failed (${xhr.status})`;
                        let retired = false;
                        if (json && json.error && json.error.message) {
                            msg = json.error.message;
                            retired = xhr.status === 404 && /no longer available/i.test(msg);
                        }
                        const err = new Error(msg);
                        err.retired = retired;
                        err.status = xhr.status;
                        reject(err);
                    };

                    xhr.onerror = () => {
                        reject(new Error('Network error while contacting Gemini. Check your connection and try again.'));
                    };

                    xhr.send(JSON.stringify(body));
                });
            }

            async function callGemini(userPrompt, onUploadProgress) {
                const settings = Settings.getAiSettings();
                if (!settings.apiKey) throw new Error('MISSING_KEY');
                if (!customPromptMode && !capturedFiles.length) throw new Error('MISSING_IMAGE');
                if (customPromptMode && !userPrompt.trim()) throw new Error('MISSING_TOPIC');

                // Try the user's chosen model first, then fall back through known-good
                // models if it's been retired by Google (common with fast-moving Gemini releases).
                const modelsToTry = [settings.model, ...FALLBACK_MODELS.filter(m => m !== settings.model)];
                let data = null;
                let lastError = null;

                for (const model of modelsToTry) {
                    try {
                        data = await requestGeneration(model, userPrompt, onUploadProgress);
                        if (model !== settings.model) {
                            App.toast(`"${settings.model}" is unavailable — used "${model}" instead`, 'default');
                        }
                        break;
                    } catch (e) {
                        lastError = e;
                        if (e.retired) continue; // try next fallback model
                        throw e; // any other error (bad key, quota, network) — stop immediately
                    }
                }
                if (!data) throw lastError || new Error('All models are currently unavailable. Please try again later.');

                const candidate = data.candidates && data.candidates[0];
                const text = candidate && candidate.content && candidate.content.parts
                    ? candidate.content.parts.map(p => p.text || '').join('')
                    : '';
                if (!text) throw new Error('The model returned an empty response. Try a clearer image.');

                let cleaned = text.trim();
                cleaned = cleaned.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '');
                let parsed;
                try { parsed = JSON.parse(cleaned); } catch (e) {
                    const match = cleaned.match(/\{[\s\S]*\}/);
                    if (match) { try { parsed = JSON.parse(match[0]); } catch (e2) { /* fallthrough */ } }
                }
                if (!parsed || !Array.isArray(parsed.questions) || parsed.questions.length === 0) {
                    throw new Error('Could not understand the AI response. Try rephrasing your prompt.');
                }
                return parsed.questions;
            }

            function insertQuestions(aiQuestions) {
                const state = State.get();
                const settings = Settings.getAiSettings();
                const optionIds = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

                const converted = aiQuestions.map(q => {
                    const opts = Array.isArray(q.options) ? q.options : [];
                    const correctIdx = Number.isInteger(q.correctIndex) ? q.correctIndex : -1;
                    return {
                        id: Utils.uid('q'),
                        question: { html: escapeHtml(String(q.question || '').trim()) },
                        optionsLayout: 'vertical',
                        explanationHtml: q.explanation ? escapeHtml(String(q.explanation).trim()) : '',
                        options: opts.slice(0, 8).map((optText, i) => ({
                            id: optionIds[i] || String(i),
                            html: escapeHtml(String(optText || '').trim()),
                            correct: i === correctIdx
                        }))
                    };
                }).filter(q => Utils.stripHtml(q.question.html) !== '');

                converted.forEach(q => { q.optionsLayout = State.computeAutoLayout(q); });

                if (converted.length === 0) throw new Error('No usable questions were generated.');

                if (settings.insertMode === 'replace') {
                    state.questions = converted;
                } else {
                    const isBlankSeed = state.questions.length === 1 &&
                        Utils.stripHtml(state.questions[0].question.html) === '' &&
                        state.questions[0].options.every(o => Utils.stripHtml(o.html) === '');
                    if (isBlankSeed) { state.questions = converted; } else { state.questions.push(...converted); }
                }

                Editor.renderQuestions();
                Preview.update(true);
                return converted.length;
            }

            async function handleGenerateClick() {
                const settings = Settings.getAiSettings();
                if (!settings.apiKey) {
                    el('aiKeyHint').hidden = false;
                    setStatus('Add your Gemini API key in Settings → AI first.', 'error');
                    return;
                }
                if (customPromptMode) {
                    if (!el('aiPromptInput').value.trim()) {
                        setStatus('Type a subject or topic (e.g. "World War II") first.', 'error');
                        return;
                    }
                } else if (!capturedFiles.length) {
                    setStatus('Capture a photo or upload a file first.', 'error');
                    return;
                } else if (capturedFiles.some(f => !f.done)) {
                    setStatus('Please wait for the files to finish uploading.', 'error');
                    return;
                }
                const userPrompt = el('aiPromptInput').value.trim() || 'Generate MCQ questions from this content.';
                const btn = el('btnAiGenerate');
                btn.disabled = true;

                const hasInlineFiles = capturedFiles.some(f => f.kind === 'image' || f.kind === 'pdf');
                const baseLabel = customPromptMode ?
                    'Researching the topic and generating questions…' :
                    (capturedFiles.length > 1 ?
                        `Analyzing ${capturedFiles.length} files and generating questions…` :
                        'Analyzing the file and generating questions…');
                setStatus(baseLabel, 'loading');

                // While the request body (which can be a large base64 PDF/
                // image) is actually being sent, show real upload progress
                // instead of a static message — this is the part that used
                // to give no feedback at all for a big file.
                const onUploadProgress = hasInlineFiles ? (fraction) => {
                    const pct = Math.round(fraction * 100);
                    if (pct >= 100) { setStatus(baseLabel, 'loading');
                        return; }
                    setStatus(`Uploading to Gemini… ${pct}%`, 'loading');
                } : null;

                try {
                    const questions = await callGemini(userPrompt, onUploadProgress);
                    const count = insertQuestions(questions);
                    setStatus('');
                    closeModal();
                    App.toast(`${count} MCQ${count === 1 ? '' : 's'} generated`, 'success');
                } catch (e) {
                    console.error(e);
                    if (e.message === 'MISSING_KEY') {
                        el('aiKeyHint').hidden = false;
                        setStatus('Add your Gemini API key in Settings → AI first.', 'error');
                    } else if (e.message === 'MISSING_IMAGE') {
                        setStatus('Capture a photo or upload a file first.', 'error');
                    } else if (e.message === 'MISSING_TOPIC') {
                        setStatus('Type a subject or topic first.', 'error');
                    } else {
                        setStatus(e.message || 'Something went wrong. Please try again.', 'error');
                    }
                } finally {
                    btn.disabled = false;
                }
            }

            function applyChip(chip, btn) {
                const textarea = el('aiPromptInput');
                const map = {
                    en: ' Write the questions in English. ',
                    bn: ' প্রশ্নগুলো বাংলায় লিখুন। ',
                    math: ' Focus on mathematical/numerical problems, preserving equations and symbols accurately. ',
                    30: ' Generate exactly 30 questions. ',
                    50: ' Generate exactly 50 questions. '
                };
                const addition = map[chip];
                if (!addition) return;
                const trimmedAddition = addition.trim();
                const isActive = textarea.value.includes(trimmedAddition);
                if (isActive) {
                    // Toggle off: remove this chip's text from the prompt.
                    textarea.value = textarea.value.replace(addition, ' ').replace(trimmedAddition, '')
                        .replace(/\s{2,}/g, ' ').trim();
                    if (btn) btn.classList.remove('is-active');
                } else {
                    // Language and question-count chips are mutually exclusive -
                    // remove any sibling in the same group before adding this one.
                    const group = (chip === 'en' || chip === 'bn') ? ['en', 'bn'] :
                        (chip == 30 || chip == 50) ? [30, 50] : null;
                    if (group) {
                        group.forEach(sibling => {
                            const siblingText = (map[sibling] || '').trim();
                            if (siblingText && textarea.value.includes(siblingText)) {
                                textarea.value = textarea.value.replace(map[sibling], ' ').replace(siblingText, '')
                                    .replace(/\s{2,}/g, ' ').trim();
                            }
                            const siblingBtn = document.querySelector(`.ai-chip[data-chip="${sibling}"]`);
                            if (siblingBtn) siblingBtn.classList.remove('is-active');
                        });
                    }
                    textarea.value = (textarea.value.trim() + addition).trim();
                    if (btn) btn.classList.add('is-active');
                }
                textarea.focus();
            }

            function bindEvents() {
                el('btnAiMode').addEventListener('click', () => openModal({}));
                el('btnAiStartCamera').addEventListener('click', openDeviceCamera);
                el('btnAiPickFile').addEventListener('click', () => el('aiFileInput').click());
                el('btnAiAddMore').addEventListener('click', () => el('aiFileInput').click());
                el('btnCloseAiModal').addEventListener('click', closeModal);
                el('btnAiCancel').addEventListener('click', closeModal);
                el('btnAiGenerate').addEventListener('click', handleGenerateClick);
                el('chkAiCustomPrompt').addEventListener('change', (e) => applyCustomPromptMode(e.target.checked));
                el('aiModalOverlay').addEventListener('click', (e) => { if (e.target.id === 'aiModalOverlay') closeModal(); });
                el('aiFileInput').addEventListener('change', (e) => {
                    handleFileSelected(e.target.files);
                    e.target.value = '';
                });
                el('aiCameraInput').addEventListener('change', (e) => {
                    handleFileSelected(e.target.files);
                    e.target.value = '';
                });
                document.querySelectorAll('.ai-chip').forEach(chip => {
                    chip.addEventListener('click', () => applyChip(chip.dataset.chip, chip));
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !el('aiModalOverlay').hidden) closeModal();
                });
            }

            return { bindEvents, openModal, closeModal };
        })();


        /* ================================================================
           APP
           ================================================================ */
        const App = (() => {
            function toast(message, type = 'default') {
                const container = document.getElementById('toastContainer');
                const el = document.createElement('div');
                el.className =
                    `toast${type === 'error' ? ' toast--error' : type === 'success' ? ' toast--success' : ''}`;
                const icon = type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info';
                el.innerHTML = `<i data-lucide="${icon}"></i><span>${escapeText(message)}</span>`;
                container.appendChild(el);
                if (window.lucide) lucide.createIcons();
                setTimeout(() => { el.classList.add('is-leaving');
                    setTimeout(() => el.remove(), 200); }, 2600);
            }

            function escapeText(str) { const div = document.createElement('div');
                div.textContent = str; return div.innerHTML; }

            function requestReset() {
                State.resetToDefault();
                const s = State.get();
                s.language = 'en';
                s.settings.pageSize = 'A4';
                s.settings.pageColor = '#FFFFFF';
                s.settings.zoom = 100;
                s.settings.fontFamily = 'Times New Roman';
                s.questions = [State.freshQuestion()];
                Storage.clear();
                fullRerender();
                toast('Document reset to defaults', 'success');
            }

            function requestDeleteQuestion(id) {
                const state = State.get();
                if (state.questions.length === 1) {
                    State.updateQuestionHtml(id, '');
                    state.questions[0].options.forEach(o => o.html = '');
                    Editor.renderQuestions();
                    Preview.update();
                    toast('Question cleared', 'success');
                    return;
                }
                State.deleteQuestion(id);
                Editor.renderQuestions();
                Preview.update();
                toast('Question deleted', 'success');
            }

            function handleSave() { const ok = Storage.save(); if (ok) toast('Saved successfully', 'success'); }

            function applyPlaceholders(lang) {
                const attr = lang === 'bn' ? 'data-ph-bn' : 'data-ph-en';
                document.querySelectorAll('.header-card [data-ph-en]').forEach(el => {
                    const text = el.getAttribute(attr);
                    if (text) el.setAttribute('placeholder', text);
                });
            }

            function setLanguage(lang) {
                State.setLanguage(lang);
                document.body.setAttribute('data-doc-lang', lang);
                document.querySelectorAll('.lang-switch__btn').forEach(btn => {
                    btn.classList.toggle('is-active', btn.dataset.lang === lang);
                });
                applyPlaceholders(lang);
                Settings.populateFontOptions();
                Editor.renderQuestions();
                Preview.update();
            }

            function bindDocumentFields() {
                const bindings = [
                    ['inpTitle', 'title'],
                    ['inpSubtitle', 'subtitle'],
                    ['inpMarks', 'marks'],
                    ['inpTime', 'time'],
                    ['inpNote', 'note']
                ];
                bindings.forEach(([id, field]) => {
                    const el = document.getElementById(id);
                    el.addEventListener('input', Utils.debounce(() => { State.setDocField(field, el.value);
                        Preview.update(); }, 120));
                });
            }

            function syncDocumentFieldsFromState() {
                const doc = State.get().document;
                document.getElementById('inpTitle').value = doc.title || '';
                document.getElementById('inpSubtitle').value = doc.subtitle || '';
                document.getElementById('inpMarks').value = doc.marks || '';
                document.getElementById('inpTime').value = doc.time || '';
                document.getElementById('inpNote').value = doc.note || '';
            }

            function bindZoomControls() {
                document.getElementById('btnZoomIn').addEventListener('click', () => {
                    const s = State.get().settings;
                    const newZoom = Utils.clamp(s.zoom + 10, 50, 200);
                    s.zoom = newZoom;
                    Preview.applyZoom();
                });
                document.getElementById('btnZoomOut').addEventListener('click', () => {
                    const s = State.get().settings;
                    const newZoom = Utils.clamp(s.zoom - 10, 50, 200);
                    s.zoom = newZoom;
                    Preview.applyZoom();
                });
                document.getElementById('zoomValue').addEventListener('click', () => {
                    const s = State.get().settings;
                    s.zoom = 100;
                    const fit = Preview.computeFitZoom();
                    s.fitZoom = fit;
                    const wrap = document.getElementById('paperWrap');
                    const scale = fit / 100;
                    wrap.style.transform = `scale(${scale})`;
                    document.getElementById('zoomValue').textContent = `100%`;
                });
            }

            function bindMobileTabs() {
                const tabs = document.querySelectorAll('.mobile-tabs__btn');
                tabs.forEach(btn => {
                    btn.addEventListener('click', () => {
                        tabs.forEach(b => b.classList.toggle('is-active', b === btn));
                        const target = btn.dataset.tab;
                        document.getElementById('panelInput').classList.toggle('is-active-mobile', target ===
                            'input');
                        document.getElementById('panelPreview').classList.toggle('is-active-mobile', target ===
                            'preview');
                    });
                });
                document.getElementById('panelInput').classList.add('is-active-mobile');
            }

            function bindHeaderActions() {
                document.getElementById('btnSave').addEventListener('click', handleSave);
                document.getElementById('btnReset').addEventListener('click', requestReset);
            }

            function bindDownload() {
                const btn = document.getElementById('btnDownload');
                const menu = document.getElementById('downloadMenu');
                const panel = document.getElementById('downloadMenuPanel');

                function closeMenu() {
                    panel.hidden = true;
                    btn.setAttribute('aria-expanded', 'false');
                }
                function openMenu() {
                    panel.hidden = false;
                    btn.setAttribute('aria-expanded', 'true');
                }

                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // No answer key at all: there's only one file to produce,
                    // so download it immediately instead of opening a menu
                    // with a single option.
                    if (!PdfGen.hasAnswerKey()) { PdfGen.downloadQuestionPaperOnly();
                        return; }
                    if (panel.hidden) openMenu();
                    else closeMenu();
                });

                document.getElementById('btnDownloadQuestionsOnly').addEventListener('click', () => {
                    closeMenu();
                    PdfGen.downloadQuestionPaperOnly();
                });
                document.getElementById('btnDownloadAnswersOnly').addEventListener('click', () => {
                    closeMenu();
                    PdfGen.downloadAnswerKeyOnly();
                });

                document.addEventListener('click', (e) => {
                    if (!panel.hidden && !menu.contains(e.target)) closeMenu();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !panel.hidden) closeMenu();
                });
            }

            function bindLanguageSwitch() {
                document.querySelectorAll('.lang-switch__btn').forEach(btn => {
                    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
                });
            }

            function fullRerender() {
                const state = State.get();
                document.body.setAttribute('data-doc-lang', state.language);
                document.documentElement.setAttribute('data-theme', state.settings.theme);
                document.querySelectorAll('.lang-switch__btn').forEach(btn => {
                    btn.classList.toggle('is-active', btn.dataset.lang === state.language);
                });
                applyPlaceholders(state.language);
                syncDocumentFieldsFromState();
                Settings.syncFormFromState();
                Editor.renderQuestions();
                Preview.updateImmediate(true);

                const container = document.getElementById('previewContainer');
                const pageSize = state.settings.pageSize;
                const dims = Preview.PAGE_SIZES_MM[pageSize] || Preview.PAGE_SIZES_MM.A4;
                container.style.aspectRatio = `${dims.w} / ${dims.h}`;

                const fit = Preview.computeFitZoom();
                state.settings.fitZoom = fit;
                state.settings.zoom = 100;
                const wrap = document.getElementById('paperWrap');
                wrap.style.transform = `scale(${fit / 100})`;
                document.getElementById('zoomValue').textContent = `100%`;

                if (window.lucide) lucide.createIcons();
            }

            function init() {
                const saved = Storage.load();
                if (saved) { const merged = Object.assign(State.defaultState(), saved);
                    State.replaceAll(merged); }

                const state = State.get();
                const dims = Preview.PAGE_SIZES_MM[state.settings.pageSize] || Preview.PAGE_SIZES_MM.A4;
                const container = document.getElementById('previewContainer');
                if (container) container.style.aspectRatio = `${dims.w} / ${dims.h}`;

                Settings.buildColorPresets();
                Editor.initToolbar();
                bindDocumentFields();
                bindZoomControls();
                bindMobileTabs();
                bindHeaderActions();
                bindDownload();
                bindLanguageSwitch();
                Settings.bindEvents();
                AiGenerator.bindEvents();
                fullRerender();
                if (saved) toast('Restored your saved project', 'default');
                if (window.lucide) lucide.createIcons();

                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(Utils.debounce(() => {
                        const s = State.get();
                        const fit = Preview.computeFitZoom();
                        s.settings.fitZoom = fit;
                        if (s.settings.zoom === 100) {
                            const wrap = document.getElementById('paperWrap');
                            wrap.style.transform = `scale(${fit / 100})`;
                        }
                    }, 200));
                    const containerEl = document.getElementById('previewContainer');
                    if (containerEl) ro.observe(containerEl);
                }

                // Warm the PDF/zip libraries in the background once the page
                // has had a chance to render and settle, so a later Download
                // click is fast rather than waiting on a fresh network
                // fetch. requestIdleCallback yields to anything more urgent
                // (typing, scrolling) and fires as soon as the browser is
                // actually idle — the timeout below is just a worst-case
                // cap forcing it to run even if the browser never reports
                // idle. Lowered from 4000/2000ms: initial render/layout is
                // done well before that on virtually any device, so the
                // longer caps were just delaying the prefetch for no
                // benefit and making the first download of a session pay
                // more of the library's network cost.
                if (window.requestIdleCallback) {
                    requestIdleCallback(() => PdfGen.prefetchLibsInBackground(), { timeout: 1500 });
                } else {
                    setTimeout(() => PdfGen.prefetchLibsInBackground(), 800);
                }
            }
            document.addEventListener('DOMContentLoaded', init);
            return { toast, requestReset, requestDeleteQuestion, handleSave };
        })();
    </script>

    <!-- ===== AI CAPTURE MODAL (rendered outside .app-container so it can never be clipped by ancestor overflow on mobile browsers) ===== -->
    <div class="ai-modal-overlay" id="aiModalOverlay" hidden>
        <div class="ai-modal" role="dialog" aria-modal="true" aria-labelledby="aiModalTitle">
            <div class="ai-modal__head">
                <h2 id="aiModalTitle"><i data-lucide="sparkles"></i> Generate MCQs with AI</h2>
                <button type="button" class="icon-btn" id="btnCloseAiModal" aria-label="Close"><i data-lucide="x"></i></button>
            </div>
            <div class="ai-modal__body" id="aiModalBody">

                <div id="aiKeyHint" class="ai-key-hint" hidden>
                </div>

                <div class="ai-capture-stage" id="aiCaptureStage">
                    <div class="ai-capture-placeholder" id="aiCapturePlaceholder">
                        <div class="ai-capture-placeholder__icon"><i data-lucide="image-plus"></i></div>
                        <span class="ai-capture-placeholder__title" id="aiCaptureTitle">No file selected</span>
                        <div class="ai-capture-placeholder__actions">
                            <button type="button" class="btn btn--secondary" id="btnAiStartCamera"><i data-lucide="camera"></i>Capture</button>
                            <button type="button" class="btn btn--secondary" id="btnAiPickFile"><i data-lucide="upload"></i>Upload</button>
                        </div>
                        <span class="ai-capture-placeholder__hint">JPG, PNG, PDF, DOCX, or PPTX (Multiple file allowed)</span>
                    </div>
                    <div class="ai-file-list" id="aiFileList" hidden>
                        <div class="ai-file-list__items" id="aiFileListItems"></div>
                        <button type="button" class="ai-file-list__add" id="btnAiAddMore"><i data-lucide="plus"></i>Add more</button>
                    </div>
                </div>

                <div class="setting-row ai-custom-prompt-row">
                    <span class="setting-row__label ai-custom-prompt-row__label">
                        <i data-lucide="wand-2"></i>
                        <span>
                            Custom Prompt
                            <small>Generate from a topic (No file needed)</small>
                        </span>
                    </span>
                    <label class="switch">
                        <input type="checkbox" id="chkAiCustomPrompt">
                        <span class="switch__track"><span class="switch__thumb"></span></span>
                    </label>
                </div>

                <div class="ai-modal__field">
                    <label for="aiPromptInput" id="aiPromptLabel">Instruction for MCQ Generation</label>
                    <textarea id="aiPromptInput" class="ai-prompt-textarea" placeholder="Generate 30 MCQs from this page, medium difficulty, include the correct answer and explanation."></textarea>
                    <div class="ai-quick-chips">
                        <button type="button" class="ai-chip" data-chip="en">English Questions</button>
                        <button type="button" class="ai-chip" data-chip="bn">বাংলা প্রশ্ন তৈরি করুন</button>
                        <button type="button" class="ai-chip" data-chip="30">30 Questions</button>
                        <button type="button" class="ai-chip" data-chip="50">50 Questions</button>
                    </div>
                </div>

                <div class="ai-modal__status" id="aiStatus"></div>
            </div>
            <div class="ai-modal__foot">
                <button type="button" class="btn btn--ghost btn--full" id="btnAiCancel">Cancel</button>
                <button type="button" class="btn btn--primary btn--full" id="btnAiGenerate"><i data-lucide="sparkles"></i> Generate MCQs</button>
            </div>
        </div>
    </div>

</body>
