<!-- App scripts (load order matters: utils → state → editor → preview → randomizer → pdf → storage → settings → app) -->
<script>

/* ===== js/utils.js ===== */
/* =========================================================================
   UTILS — reusable, stateless helper functions used across the app.
   ========================================================================= */

const Utils = (() => {

  /**
   * Generate a reasonably unique id (not cryptographically strong, but
   * sufficient for client-side list keys / DOM ids).
   */
  function uid(prefix = 'id') {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
  }

  /**
   * Convert an integer (1-999) to a zero-padded English numeral string.
   * 1 -> "01", 12 -> "12", 100 -> "100"
   */
  function toEnglishNumber(n) {
    return n < 10 ? `0${n}` : `${n}`;
  }

  const BN_DIGITS = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];

  /**
   * Convert an integer (1-999) to a zero-padded Bangla numeral string.
   * 1 -> "০১", 12 -> "১২"
   */
  function toBanglaNumber(n) {
    const padded = n < 10 ? `0${n}` : `${n}`;
    return padded.split('').map(ch => BN_DIGITS[parseInt(ch, 10)]).join('');
  }

  /** Format a question index (0-based) according to the active language. */
  function formatQuestionNumber(index, lang) {
    const n = index + 1;
    return lang === 'bn' ? toBanglaNumber(n) : toEnglishNumber(n);
  }

  const EN_OPTION_LABELS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  const BN_OPTION_LABELS = ['ক', 'খ', 'গ', 'ঘ', 'ঙ', 'চ', 'ছ', 'জ'];

  /** Get the option label (A/B/C/D or ক/খ/গ/ঘ) for a given option index. */
  function optionLabel(index, lang) {
    const arr = lang === 'bn' ? BN_OPTION_LABELS : EN_OPTION_LABELS;
    return arr[index] || String(index + 1);
  }

  /** Debounce a function call. */
  function debounce(fn, wait = 150) {
    let t = null;
    return function debounced(...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), wait);
    };
  }

  /**
   * Sanitize HTML produced by the rich text editors before it is stored
   * in state / rendered into the preview. Uses DOMPurify when available;
   * falls back to a conservative manual strip if the CDN failed to load.
   */
  function sanitizeHtml(html) {
    if (window.DOMPurify) {
      return DOMPurify.sanitize(html, {
        ALLOWED_TAGS: ['b', 'strong', 'i', 'em', 'u', 'sup', 'sub', 'span', 'br',
          'ul', 'ol', 'li', 'font', 'div'],
        ALLOWED_ATTR: ['style', 'class']
      });
    }
    // Fallback: strip script/style tags and event handler attributes.
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    tmp.querySelectorAll('script, style, iframe, object, embed').forEach(el => el.remove());
    tmp.querySelectorAll('*').forEach(el => {
      [...el.attributes].forEach(attr => {
        if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
      });
    });
    return tmp.innerHTML;
  }

  /** Strip all HTML tags, returning plain text (used for empty checks). */
  function stripHtml(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    return (tmp.textContent || tmp.innerText || '').trim();
  }

  /** Simple Fisher-Yates shuffle; returns a new array, does not mutate input. */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /** Clamp a number between min and max. */
  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  /** Normalize a hex color string, e.g. "fff" -> "#FFFFFF". Returns null if invalid. */
  function normalizeHex(value) {
    if (!value) return null;
    let v = value.trim();
    if (!v.startsWith('#')) v = `#${v}`;
    if (/^#([0-9A-Fa-f]{3})$/.test(v)) {
      v = '#' + v.slice(1).split('').map(c => c + c).join('');
    }
    if (/^#([0-9A-Fa-f]{6})$/.test(v)) return v.toUpperCase();
    return null;
  }

  /** Deep clone via structured algorithm (adequate for our plain-data state). */
  function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  return {
    uid, toEnglishNumber, toBanglaNumber, formatQuestionNumber, optionLabel,
    debounce, sanitizeHtml, stripHtml, shuffle, clamp, normalizeHex, clone
  };
})();


/* ===== js/state.js ===== */
/* =========================================================================
   STATE — centralized application state + question CRUD operations.
   No module owns direct DOM writes here; other modules read/subscribe.
   ========================================================================= */

const State = (() => {

  function freshQuestion() {
    return {
      id: Utils.uid('q'),
      question: { html: '' },
      options: [
        { id: 'a', html: '' },
        { id: 'b', html: '' },
        { id: 'c', html: '' },
        { id: 'd', html: '' }
      ]
    };
  }

  function demoQuestion() {
    return {
      id: Utils.uid('q'),
      question: { html: 'Which process is primarily responsible for the conversion of light energy into chemical energy in plants?' },
      options: [
        { id: 'a', html: 'Respiration' },
        { id: 'b', html: 'Photosynthesis' },
        { id: 'c', html: 'Transpiration' },
        { id: 'd', html: 'Germination' }
      ]
    };
  }

  function defaultState() {
    return {
      language: 'en', // 'en' | 'bn'

      document: {
        title: 'AGRICULTURAL SCIENCE EXAMINATION',
        subtitle: 'Faculty of Agriculture',
        marks: '20',
        time: '20 Minutes',
        note: ''
      },

      questions: [demoQuestion()],

      settings: {
        theme: 'light',
        pageSize: 'A4',       // A4 | Letter | Legal
        pageColor: '#FFFFFF',
        fontFamily: 'Calibri',
        fontSize: 12,
        fontColor: '#111111',
        zoom: 100
      },

      setCode: {
        enabled: false,
        numberOfSets: 1,
        codeNames: 'A, B, C, D, E, F, G, H, I, J',
        randomization: 'both' // none | questions | options | both
      },

      // Generated randomized sets live outside the "editable" state above;
      // they are derived data, recomputed by Randomizer.generateSets().
      generatedSets: [],   // [{ setCode, questions: [...] }]
      activeSetIndex: -1   // -1 = show the original (unrandomized) question order
    };
  }

  let appState = defaultState();

  function get() { return appState; }

  function replaceAll(newState) {
    appState = newState;
  }

  function resetToDefault() {
    appState = defaultState();
  }

  // ---- Document meta ----
  function setLanguage(lang) { appState.language = lang; }
  function setDocField(field, value) { appState.document[field] = value; }

  // ---- Settings ----
  function setSetting(key, value) { appState.settings[key] = value; }

  // ---- Set code config ----
  function setSetCodeField(key, value) { appState.setCode[key] = value; }

  // ---- Question CRUD ----
  function addQuestion() {
    appState.questions.push(freshQuestion());
    return appState.questions.length - 1;
  }

  function deleteQuestion(id) {
    const idx = appState.questions.findIndex(q => q.id === id);
    if (idx === -1) return;
    appState.questions.splice(idx, 1);
    if (appState.questions.length === 0) {
      appState.questions.push(freshQuestion());
    }
  }

  function duplicateQuestion(id) {
    const idx = appState.questions.findIndex(q => q.id === id);
    if (idx === -1) return;
    const copy = Utils.clone(appState.questions[idx]);
    copy.id = Utils.uid('q');
    copy.options.forEach(o => { o.id = o.id; }); // keep a/b/c/d slot ids stable
    appState.questions.splice(idx + 1, 0, copy);
  }

  function moveQuestion(id, direction) {
    const idx = appState.questions.findIndex(q => q.id === id);
    if (idx === -1) return;
    const target = idx + direction;
    if (target < 0 || target >= appState.questions.length) return;
    const [item] = appState.questions.splice(idx, 1);
    appState.questions.splice(target, 0, item);
  }

  function updateQuestionHtml(id, html) {
    const q = appState.questions.find(q => q.id === id);
    if (q) q.question.html = html;
  }

  function updateOptionHtml(questionId, optionId, html) {
    const q = appState.questions.find(q => q.id === questionId);
    if (!q) return;
    const opt = q.options.find(o => o.id === optionId);
    if (opt) opt.html = html;
  }

  return {
    get, replaceAll, resetToDefault, defaultState,
    setLanguage, setDocField, setSetting, setSetCodeField,
    addQuestion, deleteQuestion, duplicateQuestion, moveQuestion,
    updateQuestionHtml, updateOptionHtml,
    freshQuestion
  };
})();


/* ===== js/editor.js ===== */
/* =========================================================================
   EDITOR — renders the left-panel question cards, wires up contenteditable
   rich-text areas, and drives the floating formatting toolbar.

   NOTE on math support (see spec §10): rather than a heavyweight WYSIWYG
   math engine (MathLive/MathJax add real download weight and their own
   rendering pipeline that would need a *second*, separate PDF export
   path), this app implements a practical math input system built from
   native superscript/subscript commands + a symbol/expression insertion
   panel covering fractions-as-slashes, roots, Greek letters, common
   operators and pre-built expressions (x², H₂O, √, ∫, etc.). This keeps
   authoring accurate and keeps the exact same HTML pipeline driving both
   the live preview and the PDF (see §56), so what you see is always what
   prints. Documented here as the deliberate tradeoff versus a full CAS-
   grade equation editor.
   ========================================================================= */

const Editor = (() => {

  let activeEditorEl = null;      // the contenteditable currently focused
  let activeSavedRange = null;    // last known selection range within it

  const MATH_SYMBOLS = [
    '²', '³', '⁴', '½', '⅓', '¼',
    '√', '∛', '∑', '∫', '∞', '≈',
    '≠', '≤', '≥', '±', '×', '÷',
    'α', 'β', 'γ', 'δ', 'θ', 'π',
    'λ', 'μ', 'Ω', 'Δ', '∂', '∇',
    '→', '⇌', '°', '‰', '·', '…'
  ];

  /* ---------------------------------------------------------------------
     Rendering the question list (left panel)
     --------------------------------------------------------------------- */

  function renderQuestions() {
    const state = State.get();
    const list = document.getElementById('questionsList');
    const lang = state.language;

    list.innerHTML = '';

    state.questions.forEach((q, index) => {
      list.appendChild(buildQuestionCard(q, index, lang));
    });

    document.getElementById('questionCount').textContent =
      `${state.questions.length} question${state.questions.length === 1 ? '' : 's'}`;

    const nextNum = Utils.formatQuestionNumber(state.questions.length, lang);
    document.getElementById('btnAddQuestionLabel').textContent = `Add MCQ ${nextNum}`;

    if (window.lucide) lucide.createIcons();
  }

  function buildQuestionCard(q, index, lang) {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.dataset.id = q.id;

    const numLabel = Utils.formatQuestionNumber(index, lang);

    card.innerHTML = `
      <div class="question-card__head">
        <span class="question-card__number">${lang === 'bn' ? 'প্রশ্ন' : 'Question'} ${numLabel}</span>
        <div class="question-card__controls">
          <button type="button" class="qc-btn" data-action="move-up" aria-label="Move question up" title="Move up"><i data-lucide="chevron-up"></i></button>
          <button type="button" class="qc-btn" data-action="move-down" aria-label="Move question down" title="Move down"><i data-lucide="chevron-down"></i></button>
          <button type="button" class="qc-btn" data-action="duplicate" aria-label="Duplicate question" title="Duplicate"><i data-lucide="copy"></i></button>
          <button type="button" class="qc-btn qc-btn--danger" data-action="delete" aria-label="Delete question" title="Delete"><i data-lucide="trash-2"></i></button>
        </div>
      </div>
      <div class="question-card__body">
        <div class="editor-area question-editor"
             contenteditable="true"
             data-role="question"
             data-placeholder="${lang === 'bn' ? 'প্রশ্ন লিখুন...' : 'Type your question...'}"
             aria-label="Question text"></div>
        <div class="options-list"></div>
      </div>
    `;

    const qEditor = card.querySelector('[data-role="question"]');
    setEditorContent(qEditor, q.question.html);
    bindEditableEvents(qEditor, (html) => {
      State.updateQuestionHtml(q.id, html);
      Preview.update();
    });

    const optionsList = card.querySelector('.options-list');
    q.options.forEach((opt, oi) => {
      optionsList.appendChild(buildOptionRow(q.id, opt, oi, lang));
    });

    // Card-level control buttons
    card.querySelectorAll('.qc-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        if (action === 'delete') { App.requestDeleteQuestion(q.id); return; }
        if (action === 'duplicate') {
          State.duplicateQuestion(q.id);
          Editor.renderQuestions();
          Preview.update();
          App.toast(`Question duplicated`, 'success');
        } else if (action === 'move-up') {
          State.moveQuestion(q.id, -1);
          Editor.renderQuestions();
          Preview.update();
        } else if (action === 'move-down') {
          State.moveQuestion(q.id, 1);
          Editor.renderQuestions();
          Preview.update();
        }
      });
    });

    card.addEventListener('focusin', () => {
      document.querySelectorAll('.question-card.is-focused').forEach(c => c.classList.remove('is-focused'));
      card.classList.add('is-focused');
    });

    return card;
  }

  function buildOptionRow(questionId, opt, index, lang) {
    const row = document.createElement('div');
    row.className = 'option-row';
    row.innerHTML = `
      <span class="option-row__label">${Utils.optionLabel(index, lang)}</span>
      <div class="editor-area"
           contenteditable="true"
           data-role="option"
           data-option-id="${opt.id}"
           data-placeholder="${lang === 'bn' ? 'অপশন লিখুন...' : 'Option text...'}"
           aria-label="Option ${Utils.optionLabel(index, lang)}"></div>
    `;
    const editorEl = row.querySelector('[data-role="option"]');
    setEditorContent(editorEl, opt.html);
    bindEditableEvents(editorEl, (html) => {
      State.updateOptionHtml(questionId, opt.id, html);
      Preview.update();
    });
    return row;
  }

  function setEditorContent(el, html) {
    el.innerHTML = html || '';
    toggleEmptyState(el);
  }

  function toggleEmptyState(el) {
    const isEmpty = Utils.stripHtml(el.innerHTML) === '';
    el.classList.toggle('is-empty', isEmpty);
  }

  /* ---------------------------------------------------------------------
     contenteditable wiring: input handling, selection tracking, toolbar
     --------------------------------------------------------------------- */

  function bindEditableEvents(el, onChangeCallback) {
    const debouncedChange = Utils.debounce(() => {
      onChangeCallback(Utils.sanitizeHtml(el.innerHTML));
    }, 180);

    el.addEventListener('input', () => {
      toggleEmptyState(el);
      debouncedChange();
    });

    el.addEventListener('focus', () => {
      activeEditorEl = el;
      showToolbarFor(el);
    });

    el.addEventListener('keyup', () => rememberSelection(el));
    el.addEventListener('mouseup', () => rememberSelection(el));

    el.addEventListener('blur', (e) => {
      // Delay hiding so toolbar button clicks (which blur the editor) still register.
      setTimeout(() => {
        const toolbar = document.getElementById('rtToolbar');
        if (toolbar.contains(document.activeElement)) return;
        if (document.activeElement === el) return;
        hideToolbar();
      }, 150);
    });

    // Keyboard shortcuts
    el.addEventListener('keydown', (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (!mod) return;
      const key = e.key.toLowerCase();
      if (key === 'b') { e.preventDefault(); exec('bold'); }
      else if (key === 'i') { e.preventDefault(); exec('italic'); }
      else if (key === 'u') { e.preventDefault(); exec('underline'); }
      else if (key === 'z') { e.preventDefault(); exec('undo'); }
      else if (key === 'y') { e.preventDefault(); exec('redo'); }
    });
  }

  function rememberSelection(el) {
    const sel = window.getSelection();
    if (sel.rangeCount > 0 && el.contains(sel.anchorNode)) {
      activeSavedRange = sel.getRangeAt(0).cloneRange();
    }
  }

  function restoreSelection() {
    if (!activeSavedRange) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(activeSavedRange);
  }

  function showToolbarFor(el) {
    const toolbar = document.getElementById('rtToolbar');
    const rect = el.getBoundingClientRect();
    toolbar.hidden = false;

    // Position above the editor if there's room, else below.
    const toolbarHeight = 44;
    let top = rect.top - toolbarHeight - 8;
    if (top < 8) top = rect.bottom + 8;
    let left = Utils.clamp(rect.left, 8, window.innerWidth - 380);

    toolbar.style.top = `${top + window.scrollY}px`;
    toolbar.style.left = `${left}px`;
  }

  function hideToolbar() {
    const toolbar = document.getElementById('rtToolbar');
    toolbar.hidden = true;
    document.getElementById('rtMathPanel').hidden = true;
  }

  /** Execute a document.execCommand-based formatting action on the active editor. */
  function exec(cmd, value = null) {
    if (!activeEditorEl) return;
    activeEditorEl.focus();
    restoreSelection();
    try {
      document.execCommand(cmd, false, value);
    } catch (err) {
      // Some commands (e.g. hiliteColor in older engines) may need styleWithCSS.
      document.execCommand('styleWithCSS', false, true);
      try { document.execCommand(cmd, false, value); } catch (e2) { /* no-op */ }
    }
    rememberSelection(activeEditorEl);
    toggleEmptyState(activeEditorEl);
    activeEditorEl.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function insertTextAtCursor(text) {
    if (!activeEditorEl) return;
    activeEditorEl.focus();
    restoreSelection();
    document.execCommand('insertText', false, text);
    rememberSelection(activeEditorEl);
    toggleEmptyState(activeEditorEl);
    activeEditorEl.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function buildMathPanel() {
    const panel = document.getElementById('rtMathPanel');
    panel.innerHTML = MATH_SYMBOLS.map(sym =>
      `<button type="button" class="rt-math-symbol" data-symbol="${sym}">${sym}</button>`
    ).join('');
    panel.querySelectorAll('.rt-math-symbol').forEach(btn => {
      btn.addEventListener('click', () => {
        insertTextAtCursor(btn.dataset.symbol);
      });
    });
  }

  function initToolbar() {
    buildMathPanel();

    document.querySelectorAll('.rt-btn[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', (e) => e.preventDefault()); // preserve selection
      btn.addEventListener('click', () => exec(btn.dataset.cmd));
    });

    document.querySelectorAll('.rt-color input[type="color"]').forEach(input => {
      input.addEventListener('mousedown', () => rememberSelection(activeEditorEl));
      input.addEventListener('input', () => {
        document.execCommand('styleWithCSS', false, true);
        exec(input.dataset.cmd, input.value);
      });
    });

    const mathBtn = document.getElementById('rtMathBtn');
    const mathPanel = document.getElementById('rtMathPanel');
    mathBtn.addEventListener('mousedown', (e) => e.preventDefault());
    mathBtn.addEventListener('click', () => {
      mathPanel.hidden = !mathPanel.hidden;
    });

    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('rtMathDropdown');
      if (dropdown && !dropdown.contains(e.target)) mathPanel.hidden = true;
    });
  }

  return { renderQuestions, initToolbar, hideToolbar };
})();


/* ===== js/preview.js ===== */
/* =========================================================================
   PREVIEW — renders appState into the paper element. This is the single
   source of truth for document appearance (see spec §56): the exact same
   render function backs the on-screen preview, and PDF generation reads
   the resulting DOM structure/measurements rather than maintaining a
   separate layout implementation.
   ========================================================================= */

const Preview = (() => {

  const PAGE_SIZES_MM = {
    A4:     { w: 210,   h: 297   },
    Letter: { w: 215.9, h: 279.4 },
    Legal:  { w: 215.9, h: 355.6 }
  };

  const FONT_STACKS = {
    'Calibri': "'Calibri','Carlito',Arial,sans-serif",
    'Times New Roman': "'Times New Roman',Times,serif",
    'Cambria Math': "'Cambria Math','Cambria',serif",
    'Kalpurush': "'Kalpurush','Noto Serif Bengali',sans-serif",
    'Noto Serif Bengali': "'Noto Serif Bengali',serif",
    'Hind Siliguri': "'Hind Siliguri',sans-serif",
    'Shonar Bangla': "'Shonar Bangla','Noto Serif Bengali',sans-serif",
    'Nikosh BAN': "'Nikosh BAN','Noto Serif Bengali',sans-serif"
  };

  /** Returns the question set currently being previewed (original or a generated set). */
  function currentQuestions() {
    const state = State.get();
    if (state.setCode.enabled && state.activeSetIndex >= 0 && state.generatedSets[state.activeSetIndex]) {
      return state.generatedSets[state.activeSetIndex].questions;
    }
    return state.questions;
  }

  function currentSetCode() {
    const state = State.get();
    if (state.setCode.enabled && state.activeSetIndex >= 0 && state.generatedSets[state.activeSetIndex]) {
      return state.generatedSets[state.activeSetIndex].setCode;
    }
    return null;
  }

  function applyPaperDimensions() {
    const state = State.get();
    const paper = document.getElementById('paper');
    const dims = PAGE_SIZES_MM[state.settings.pageSize] || PAGE_SIZES_MM.A4;
    paper.style.width = `${dims.w}mm`;
    paper.style.minHeight = `${dims.h}mm`;
    paper.style.background = state.settings.pageColor || '#FFFFFF';
  }

  function applyZoom() {
    const state = State.get();
    const wrap = document.getElementById('paperWrap');
    wrap.style.transform = `scale(${state.settings.zoom / 100})`;
    document.getElementById('zoomValue').textContent = `${state.settings.zoom}%`;
  }

  function renderDocumentBody() {
    const state = State.get();
    const lang = state.language;
    const doc = state.document;
    const questions = currentQuestions();
    const setCode = currentSetCode();
    const fontStack = FONT_STACKS[state.settings.fontFamily] || FONT_STACKS.Calibri;

    const hasMeta = !!(doc.title || doc.subtitle || doc.marks || doc.time);
    const hasQuestionContent = questions.some(q =>
      Utils.stripHtml(q.question.html) !== '' || q.options.some(o => Utils.stripHtml(o.html) !== '')
    );

    let html = `<div class="doc" data-doc-font="${lang}" style="font-family:${fontStack};font-size:${state.settings.fontSize}pt;color:${state.settings.fontColor};">`;

    if (setCode) {
      html += `<div class="doc__setcode">${lang === 'bn' ? 'সেট' : 'Set'}: ${escapeHtml(setCode)}</div>`;
    }

    if (doc.title) html += `<div class="doc__title">${escapeHtml(doc.title)}</div>`;
    if (doc.subtitle) html += `<div class="doc__subtitle">${escapeHtml(doc.subtitle)}</div>`;

    if (doc.marks || doc.time) {
      html += `<div class="doc__metarow">
        <span>${doc.marks ? `${lang === 'bn' ? 'মান' : 'Marks'}: ${escapeHtml(doc.marks)}` : ''}</span>
        <span>${doc.time ? `${lang === 'bn' ? 'সময়' : 'Time'}: ${escapeHtml(doc.time)}` : ''}</span>
      </div>`;
    }

    if (hasMeta) html += `<div class="doc__divider"></div>`;

    if (doc.note) {
      html += `<div class="doc__note">${lang === 'bn' ? 'নোট' : 'Note'}: ${escapeHtml(doc.note)}</div>`;
    }

    if (!hasQuestionContent) {
      html += `<div class="doc--empty-state">${lang === 'bn' ? 'প্রশ্ন যোগ করুন প্রিভিউ দেখতে...' : 'Add a question to see the live preview...'}</div>`;
    } else {
      html += `<div class="doc__questions">`;
      questions.forEach((q, i) => {
        const num = Utils.formatQuestionNumber(i, lang);
        html += `<div class="doc-question">
          <div class="doc-question__text">
            <span class="doc-question__number">${num}.</span>
            <span class="doc-question__content">${q.question.html || ''}</span>
          </div>
          <div class="doc-options">`;
        q.options.forEach((opt, oi) => {
          if (Utils.stripHtml(opt.html) === '' && !hasQuestionContent) return;
          html += `<div class="doc-option">
            <span class="doc-option__label">${Utils.optionLabel(oi, lang)}</span>
            <span class="doc-option__content">${opt.html || ''}</span>
          </div>`;
        });
        html += `</div></div>`;
      });
      html += `</div>`;
    }

    html += `</div>`;

    document.getElementById('paper').innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderSetPicker() {
    const state = State.get();
    const wrap = document.getElementById('setSwitch');
    const select = document.getElementById('setPicker');

    if (!state.setCode.enabled || state.generatedSets.length === 0) {
      wrap.hidden = true;
      return;
    }

    wrap.hidden = false;
    select.innerHTML = state.generatedSets.map((s, i) =>
      `<option value="${i}">${state.language === 'bn' ? 'সেট' : 'Set'} ${escapeHtml(s.setCode)}</option>`
    ).join('');

    if (state.activeSetIndex < 0 || state.activeSetIndex >= state.generatedSets.length) {
      state.activeSetIndex = 0;
    }
    select.value = String(state.activeSetIndex);
  }

  const update = Utils.debounce(() => {
    applyPaperDimensions();
    renderDocumentBody();
    renderSetPicker();
  }, 60);

  function updateImmediate() {
    applyPaperDimensions();
    renderDocumentBody();
    renderSetPicker();
  }

  return { update, updateImmediate, applyZoom, applyPaperDimensions, PAGE_SIZES_MM, FONT_STACKS, currentQuestions, currentSetCode };
})();


/* ===== js/randomizer.js ===== */
/* =========================================================================
   RANDOMIZER — deterministic-per-generation set creation.
   Randomization is computed once when "Generate Sets" is clicked and the
   resulting structures are stored in state.generatedSets; the preview and
   PDF export both read from that stored structure so re-rendering never
   silently reshuffles a set that's already been generated (see spec §29).
   ========================================================================= */

const Randomizer = (() => {

  function parseSetNames(raw, count) {
    const names = (raw || '')
      .split(',')
      .map(s => s.trim())
      .filter(Boolean);

    const result = [];
    for (let i = 0; i < count; i++) {
      result.push(names[i] || String.fromCharCode(65 + i)); // fallback: A, B, C...
    }
    return result;
  }

  /** Randomize option order within a single question, keeping html bound to its option id. */
  function randomizeOptionsForQuestion(question) {
    const clone = Utils.clone(question);
    clone.options = Utils.shuffle(clone.options);
    return clone;
  }

  function buildSetQuestions(baseQuestions, randomizationType) {
    let questions = Utils.clone(baseQuestions);

    if (randomizationType === 'questions' || randomizationType === 'both') {
      questions = Utils.shuffle(questions);
    }
    if (randomizationType === 'options' || randomizationType === 'both') {
      questions = questions.map(randomizeOptionsForQuestion);
    }
    return questions;
  }

  /**
   * Generate N sets from the current base question list and store them
   * in appState.generatedSets. Returns the generated sets array.
   */
  function generateSets() {
    const state = State.get();
    const count = Utils.clamp(parseInt(state.setCode.numberOfSets, 10) || 1, 1, 26);
    const names = parseSetNames(state.setCode.codeNames, count);
    const randType = state.setCode.randomization;

    const sets = names.map(name => ({
      setCode: name,
      questions: buildSetQuestions(state.questions, randType)
    }));

    state.generatedSets = sets;
    state.activeSetIndex = 0;
    return sets;
  }

  function clearSets() {
    const state = State.get();
    state.generatedSets = [];
    state.activeSetIndex = -1;
  }

  return { generateSets, clearSets, parseSetNames };
})();


/* ===== js/pdf.js ===== */
/* =========================================================================
   PDF — client-side PDF generation.

   STRATEGY (see spec §49, §56): jsPDF's `html()` renderer is used because
   it renders directly from the *same* live DOM node that powers the
   preview (a temporary off-screen clone of #paper with zoom reset to
   100%), so what's on screen is what prints — no separate layout engine
   to keep in sync. jsPDF's html() uses html2canvas internally for layout
   but rasterizes at a high scale factor for crisp output; note that this
   means body text is embedded as image data rather than fully selectable
   vector text (a known browser-side limitation when preserving exact
   CSS multi-column layout + custom web fonts + circular option badges).
   This tradeoff is documented here rather than silently degrading the
   layout to achieve selectable text.
   ========================================================================= */

const PdfGen = (() => {

  /** Build an offscreen, print-ready clone of the paper for a given question set. */
  function buildOffscreenPaper(questions, setCode) {
    const state = State.get();
    const lang = state.language;
    const doc = state.document;
    const dims = Preview.PAGE_SIZES_MM[state.settings.pageSize] || Preview.PAGE_SIZES_MM.A4;
    const fontStack = Preview.FONT_STACKS[state.settings.fontFamily] || Preview.FONT_STACKS.Calibri;

    const container = document.createElement('div');
    container.className = 'paper';
    container.style.position = 'fixed';
    container.style.left = '-99999px';
    container.style.top = '0';
    container.style.width = `${dims.w}mm`;
    container.style.minHeight = `${dims.h}mm`;
    container.style.background = state.settings.pageColor || '#FFFFFF';
    container.style.boxShadow = 'none';

    // Reuse the exact same render function preview.js uses, targeting this node.
    const html = renderDocHtml(questions, setCode, doc, lang, fontStack, state);
    container.innerHTML = html;

    document.body.appendChild(container);
    return container;
  }

  /** Mirrors Preview's renderDocumentBody() but returns a string for an arbitrary question set. */
  function renderDocHtml(questions, setCode, doc, lang, fontStack, state) {
    const esc = (str) => {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    };

    const hasMeta = !!(doc.title || doc.subtitle || doc.marks || doc.time);
    const hasQuestionContent = questions.some(q =>
      Utils.stripHtml(q.question.html) !== '' || q.options.some(o => Utils.stripHtml(o.html) !== '')
    );

    let html = `<div class="doc" data-doc-font="${lang}" style="font-family:${fontStack};font-size:${state.settings.fontSize}pt;color:${state.settings.fontColor};">`;

    if (setCode) html += `<div class="doc__setcode">${lang === 'bn' ? 'সেট' : 'Set'}: ${esc(setCode)}</div>`;
    if (doc.title) html += `<div class="doc__title">${esc(doc.title)}</div>`;
    if (doc.subtitle) html += `<div class="doc__subtitle">${esc(doc.subtitle)}</div>`;

    if (doc.marks || doc.time) {
      html += `<div class="doc__metarow">
        <span>${doc.marks ? `${lang === 'bn' ? 'মান' : 'Marks'}: ${esc(doc.marks)}` : ''}</span>
        <span>${doc.time ? `${lang === 'bn' ? 'সময়' : 'Time'}: ${esc(doc.time)}` : ''}</span>
      </div>`;
    }

    if (hasMeta) html += `<div class="doc__divider"></div>`;
    if (doc.note) html += `<div class="doc__note">${lang === 'bn' ? 'নোট' : 'Note'}: ${esc(doc.note)}</div>`;

    if (hasQuestionContent) {
      html += `<div class="doc__questions">`;
      questions.forEach((q, i) => {
        const num = Utils.formatQuestionNumber(i, lang);
        html += `<div class="doc-question">
          <div class="doc-question__text">
            <span class="doc-question__number">${num}.</span>
            <span class="doc-question__content">${q.question.html || ''}</span>
          </div>
          <div class="doc-options">`;
        q.options.forEach((opt, oi) => {
          html += `<div class="doc-option">
            <span class="doc-option__label">${Utils.optionLabel(oi, lang)}</span>
            <span class="doc-option__content">${opt.html || ''}</span>
          </div>`;
        });
        html += `</div></div>`;
      });
      html += `</div>`;
    }

    html += `</div>`;
    return html;
  }

  /** Generate a single jsPDF document (returns a jsPDF instance) for the given question set. */
  function generateSinglePdf(questions, setCode) {
    return new Promise((resolve, reject) => {
      const state = State.get();
      const sizeKey = state.settings.pageSize;
      const orientation = 'portrait';
      const unitFormat = sizeKey === 'A4' ? 'a4' : (sizeKey === 'Letter' ? 'letter' : 'legal');

      const { jsPDF } = window.jspdf || {};
      if (!jsPDF) { reject(new Error('jsPDF failed to load')); return; }

      const pdf = new jsPDF({ orientation, unit: 'mm', format: unitFormat });
      const node = buildOffscreenPaper(questions, setCode);

      const marginMm = 0; // margins are already baked into .paper's own padding
      pdf.html(node, {
        margin: marginMm,
        autoPaging: 'text',
        html2canvas: {
          scale: 2.83, // ~72dpi CSS px -> ~204dpi output for crisp text
          useCORS: true,
          backgroundColor: state.settings.pageColor || '#FFFFFF'
        },
        width: Preview.PAGE_SIZES_MM[sizeKey].w,
        windowWidth: node.offsetWidth || 794,
        callback: (doc) => {
          document.body.removeChild(node);
          resolve(doc);
        }
      });
    });
  }

  function safeFileName(str) {
    return String(str || 'Document').replace(/[^a-z0-9\-_]+/gi, '_').slice(0, 60);
  }

  /** Main entry point: download either a single PDF or a ZIP of multiple set PDFs. */
  async function downloadDocument() {
    const state = State.get();
    const btn = document.getElementById('btnDownload');
    const labelEl = document.getElementById('btnDownloadLabel');
    const originalLabel = labelEl.textContent;

    btn.disabled = true;
    labelEl.textContent = 'Generating…';

    try {
      const title = state.document.title || 'MCQ_Question_Paper';
      const baseName = safeFileName(title);

      if (state.setCode.enabled && state.generatedSets.length > 1) {
        // Multiple sets -> ZIP
        if (!window.JSZip) throw new Error('JSZip failed to load');
        const zip = new JSZip();

        for (const set of state.generatedSets) {
          const pdf = await generateSinglePdf(set.questions, set.setCode);
          const blob = pdf.output('blob');
          zip.file(`MCQ_Set_${safeFileName(set.setCode)}.pdf`, blob);
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        triggerDownload(zipBlob, `${baseName}_Sets.zip`);
        App.toast('ZIP with all sets generated successfully', 'success');

      } else if (state.setCode.enabled && state.generatedSets.length === 1) {
        const set = state.generatedSets[0];
        const pdf = await generateSinglePdf(set.questions, set.setCode);
        pdf.save(`MCQ_Set_${safeFileName(set.setCode)}.pdf`);
        App.toast('PDF generated successfully', 'success');

      } else {
        const pdf = await generateSinglePdf(state.questions, null);
        pdf.save(`${baseName}.pdf`);
        App.toast('PDF generated successfully', 'success');
      }
    } catch (err) {
      console.error('PDF generation failed:', err);
      App.toast('Unable to generate PDF. Please try again.', 'error');
    } finally {
      btn.disabled = false;
      labelEl.textContent = originalLabel;
    }
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  return { downloadDocument };
})();


/* ===== js/storage.js ===== */
/* =========================================================================
   STORAGE — localStorage persistence for the whole project.
   ========================================================================= */

const Storage = (() => {

  const KEY = 'mcqGenerator.project.v1';
  let available = true;

  function checkAvailability() {
    try {
      const testKey = '__mcq_storage_test__';
      localStorage.setItem(testKey, '1');
      localStorage.removeItem(testKey);
      available = true;
    } catch (e) {
      available = false;
    }
    return available;
  }

  function save() {
    if (!checkAvailability()) {
      App.toast('Automatic saving is unavailable in this browser.', 'error');
      return false;
    }
    try {
      const payload = JSON.stringify(State.get());
      localStorage.setItem(KEY, payload);
      return true;
    } catch (e) {
      console.error('Save failed:', e);
      App.toast('Unable to save your project.', 'error');
      return false;
    }
  }

  function load() {
    if (!checkAvailability()) return null;
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      console.error('Load failed:', e);
      return null;
    }
  }

  function clear() {
    if (!checkAvailability()) return;
    try { localStorage.removeItem(KEY); } catch (e) { /* no-op */ }
  }

  return { save, load, clear, checkAvailability };
})();


/* ===== js/settings.js ===== */
/* =========================================================================
   SETTINGS — wires up the settings drawer: appearance, page setup,
   document formatting, and set-code/randomization controls.
   ========================================================================= */

const Settings = (() => {

  const FONT_GROUPS = {
    en: ['Calibri', 'Times New Roman', 'Cambria Math'],
    bn: ['Kalpurush', 'Noto Serif Bengali', 'Hind Siliguri', 'Shonar Bangla', 'Nikosh BAN']
  };

  const PAGE_COLOR_PRESETS = [
    { name: 'White', hex: '#FFFFFF' },
    { name: 'Ivory', hex: '#FFFFF0' },
    { name: 'Light Gray', hex: '#F3F4F6' },
    { name: 'Light Blue', hex: '#EFF6FF' }
  ];

  function populateFontOptions() {
    const state = State.get();
    const select = document.getElementById('selFontFamily');
    const groupFonts = FONT_GROUPS[state.language];

    select.innerHTML = groupFonts.map(f => `<option value="${f}">${f}</option>`).join('');

    // Keep current font if it's still valid for this language group, else default to first.
    if (groupFonts.includes(state.settings.fontFamily)) {
      select.value = state.settings.fontFamily;
    } else {
      state.settings.fontFamily = groupFonts[0];
      select.value = groupFonts[0];
    }
  }

  function buildColorPresets() {
    const wrap = document.getElementById('colorPresets');
    wrap.innerHTML = PAGE_COLOR_PRESETS.map(p =>
      `<button type="button" class="color-preset" style="background:${p.hex}" data-hex="${p.hex}" title="${p.name}" aria-label="${p.name}"></button>`
    ).join('');

    wrap.querySelectorAll('.color-preset').forEach(btn => {
      btn.addEventListener('click', () => applyPageColor(btn.dataset.hex));
    });
  }

  function syncColorPresetActive() {
    const state = State.get();
    document.querySelectorAll('.color-preset').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.hex.toUpperCase() === state.settings.pageColor.toUpperCase());
    });
  }

  function applyPageColor(hex) {
    const normalized = Utils.normalizeHex(hex);
    if (!normalized) return;
    State.setSetting('pageColor', normalized);
    document.getElementById('selPageColor').value = normalized;
    document.getElementById('selPageColorHex').value = normalized;
    syncColorPresetActive();
    Preview.update();
  }

  function applyFontColor(hex) {
    const normalized = Utils.normalizeHex(hex);
    if (!normalized) return;
    State.setSetting('fontColor', normalized);
    document.getElementById('selFontColor').value = normalized;
    document.getElementById('selFontColorHex').value = normalized;
    Preview.update();
  }

  function openDrawer() {
    document.getElementById('settingsDrawer').classList.add('is-open');
    document.getElementById('settingsDrawer').setAttribute('aria-hidden', 'false');
    document.getElementById('drawerOverlay').hidden = false;
    document.getElementById('btnSettings').setAttribute('aria-expanded', 'true');
    document.getElementById('btnSettings').classList.add('is-active');
  }

  function closeDrawer() {
    document.getElementById('settingsDrawer').classList.remove('is-open');
    document.getElementById('settingsDrawer').setAttribute('aria-hidden', 'true');
    document.getElementById('drawerOverlay').hidden = true;
    document.getElementById('btnSettings').setAttribute('aria-expanded', 'false');
    document.getElementById('btnSettings').classList.remove('is-active');
  }

  function syncFormFromState() {
    const state = State.get();

    // Theme
    document.querySelectorAll('.segmented__btn[data-theme]').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.theme === state.settings.theme);
    });

    // Page setup
    document.getElementById('selPageSize').value = state.settings.pageSize;
    document.getElementById('selPageColor').value = state.settings.pageColor;
    document.getElementById('selPageColorHex').value = state.settings.pageColor;
    syncColorPresetActive();

    // Document formatting
    populateFontOptions();
    document.getElementById('selFontSize').value = String(state.settings.fontSize);
    document.getElementById('selFontColor').value = state.settings.fontColor;
    document.getElementById('selFontColorHex').value = state.settings.fontColor;

    // Set code
    document.getElementById('chkSetCode').checked = state.setCode.enabled;
    document.getElementById('setCodeOptions').hidden = !state.setCode.enabled;
    document.getElementById('selNumSets').value = String(state.setCode.numberOfSets);
    document.getElementById('inpSetNames').value = state.setCode.codeNames;
    document.getElementById('selRandomType').value = state.setCode.randomization;
  }

  function bindEvents() {
    document.getElementById('btnSettings').addEventListener('click', openDrawer);
    document.getElementById('btnCloseSettings').addEventListener('click', closeDrawer);
    document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

    // Theme toggle
    document.querySelectorAll('.segmented__btn[data-theme]').forEach(btn => {
      btn.addEventListener('click', () => {
        const theme = btn.dataset.theme;
        State.setSetting('theme', theme);
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelectorAll('.segmented__btn[data-theme]').forEach(b => b.classList.toggle('is-active', b === btn));
      });
    });

    // Page size
    document.getElementById('selPageSize').addEventListener('change', (e) => {
      State.setSetting('pageSize', e.target.value);
      Preview.update();
    });

    // Page color
    document.getElementById('selPageColor').addEventListener('input', (e) => applyPageColor(e.target.value));
    document.getElementById('selPageColorHex').addEventListener('change', (e) => applyPageColor(e.target.value));

    // Font family / size / color
    document.getElementById('selFontFamily').addEventListener('change', (e) => {
      State.setSetting('fontFamily', e.target.value);
      Preview.update();
    });
    document.getElementById('selFontSize').addEventListener('change', (e) => {
      State.setSetting('fontSize', parseInt(e.target.value, 10));
      Preview.update();
    });
    document.getElementById('selFontColor').addEventListener('input', (e) => applyFontColor(e.target.value));
    document.getElementById('selFontColorHex').addEventListener('change', (e) => applyFontColor(e.target.value));

    // Set code toggle
    document.getElementById('chkSetCode').addEventListener('change', (e) => {
      State.setSetCodeField('enabled', e.target.checked);
      document.getElementById('setCodeOptions').hidden = !e.target.checked;
      if (!e.target.checked) {
        Randomizer.clearSets();
        document.getElementById('setGenStatus').textContent = '';
      }
      Preview.update();
    });

    document.getElementById('selNumSets').addEventListener('change', (e) => {
      State.setSetCodeField('numberOfSets', parseInt(e.target.value, 10));
    });
    document.getElementById('inpSetNames').addEventListener('input', Utils.debounce((e) => {
      State.setSetCodeField('codeNames', e.target.value);
    }, 200));
    document.getElementById('selRandomType').addEventListener('change', (e) => {
      State.setSetCodeField('randomization', e.target.value);
    });

    document.getElementById('btnGenerateSets').addEventListener('click', () => {
      const state = State.get();
      const hasContent = state.questions.some(q => Utils.stripHtml(q.question.html) !== '');
      if (!hasContent) {
        document.getElementById('setGenStatus').textContent = 'Add at least one question before generating sets.';
        return;
      }
      Randomizer.generateSets();
      Preview.update();
      const count = state.generatedSets.length;
      document.getElementById('setGenStatus').textContent = `${count} set${count === 1 ? '' : 's'} generated successfully.`;
      App.toast(`${count} set${count === 1 ? '' : 's'} generated`, 'success');
    });

    // Set picker (preview toolbar)
    document.getElementById('setPicker').addEventListener('change', (e) => {
      State.get().activeSetIndex = parseInt(e.target.value, 10);
      Preview.updateImmediate();
    });

    // Drawer footer save/reset mirror header buttons
    document.getElementById('btnDrawerSave').addEventListener('click', () => App.handleSave());
    document.getElementById('btnDrawerReset').addEventListener('click', () => App.requestReset());

    // Escape closes drawer
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('settingsDrawer').classList.contains('is-open')) {
        closeDrawer();
      }
    });
  }

  return { bindEvents, syncFormFromState, buildColorPresets, populateFontOptions, openDrawer, closeDrawer };
})();


/* ===== js/app.js ===== */
/* =========================================================================
   APP — bootstraps the application, wires top-level controls (document
   fields, language switch, zoom, save/reset, mobile tabs, toasts, confirm
   modal) and coordinates the other modules.
   ========================================================================= */

const App = (() => {

  let pendingResetConfirm = false;
  let pendingDeleteQuestionId = null;

  /* ---------------------------------------------------------------------
     Toasts
     --------------------------------------------------------------------- */

  function toast(message, type = 'default') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast${type === 'error' ? ' toast--error' : type === 'success' ? ' toast--success' : ''}`;
    const icon = type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info';
    el.innerHTML = `<i data-lucide="${icon}"></i><span>${escapeText(message)}</span>`;
    container.appendChild(el);
    if (window.lucide) lucide.createIcons();

    setTimeout(() => {
      el.classList.add('is-leaving');
      setTimeout(() => el.remove(), 200);
    }, 2600);
  }

  function escapeText(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ---------------------------------------------------------------------
     Confirm modal (used for Reset)
     --------------------------------------------------------------------- */

  function showConfirm(onConfirm) {
    const overlay = document.getElementById('confirmOverlay');
    overlay.hidden = false;
    const okBtn = document.getElementById('btnConfirmOk');
    const cancelBtn = document.getElementById('btnConfirmCancel');

    const cleanup = () => {
      overlay.hidden = true;
      okBtn.removeEventListener('click', handleOk);
      cancelBtn.removeEventListener('click', handleCancel);
    };
    const handleOk = () => { cleanup(); onConfirm(); };
    const handleCancel = () => cleanup();

    okBtn.addEventListener('click', handleOk);
    cancelBtn.addEventListener('click', handleCancel);
  }

  function requestReset() {
    showConfirm(() => {
      State.resetToDefault();
      // Reset explicitly re-applies documented defaults (spec §32):
      const s = State.get();
      s.language = 'en';
      s.settings.pageSize = 'A4';
      s.settings.pageColor = '#FFFFFF';
      s.settings.zoom = 100;
      s.questions = [State.freshQuestion()];
      Storage.clear();
      fullRerender();
      toast('Document reset to defaults', 'success');
    });
  }

  function requestDeleteQuestion(id) {
    const state = State.get();
    if (state.questions.length === 1) {
      // Deleting the last question just clears its content instead of
      // leaving the user with zero question cards.
      State.updateQuestionHtml(id, '');
      state.questions[0].options.forEach(o => o.html = '');
      Editor.renderQuestions();
      Preview.update();
      toast('Question cleared', 'success');
      return;
    }
    State.deleteQuestion(id);
    Editor.renderQuestions();
    Preview.update();
    toast('Question deleted', 'success');
  }

  /* ---------------------------------------------------------------------
     Save
     --------------------------------------------------------------------- */

  function handleSave() {
    const ok = Storage.save();
    if (ok) toast('Saved successfully', 'success');
  }

  /* ---------------------------------------------------------------------
     Language switch
     --------------------------------------------------------------------- */

  function setLanguage(lang) {
    State.setLanguage(lang);
    document.body.setAttribute('data-doc-lang', lang);
    document.querySelectorAll('.lang-switch__btn').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.lang === lang);
    });
    Settings.populateFontOptions();
    Editor.renderQuestions();
    Preview.update();
  }

  /* ---------------------------------------------------------------------
     Document meta field bindings
     --------------------------------------------------------------------- */

  function bindDocumentFields() {
    const bindings = [
      ['inpTitle', 'title'],
      ['inpSubtitle', 'subtitle'],
      ['inpMarks', 'marks'],
      ['inpTime', 'time'],
      ['inpNote', 'note']
    ];
    bindings.forEach(([id, field]) => {
      const el = document.getElementById(id);
      el.addEventListener('input', Utils.debounce(() => {
        State.setDocField(field, el.value);
        Preview.update();
      }, 120));
    });
  }

  function syncDocumentFieldsFromState() {
    const doc = State.get().document;
    document.getElementById('inpTitle').value = doc.title || '';
    document.getElementById('inpSubtitle').value = doc.subtitle || '';
    document.getElementById('inpMarks').value = doc.marks || '';
    document.getElementById('inpTime').value = doc.time || '';
    document.getElementById('inpNote').value = doc.note || '';
  }

  /* ---------------------------------------------------------------------
     Zoom controls
     --------------------------------------------------------------------- */

  function bindZoomControls() {
    document.getElementById('btnZoomIn').addEventListener('click', () => {
      const s = State.get().settings;
      s.zoom = Utils.clamp(s.zoom + 10, 50, 200);
      Preview.applyZoom();
    });
    document.getElementById('btnZoomOut').addEventListener('click', () => {
      const s = State.get().settings;
      s.zoom = Utils.clamp(s.zoom - 10, 50, 200);
      Preview.applyZoom();
    });
    document.getElementById('zoomValue').addEventListener('click', () => {
      State.get().settings.zoom = 100;
      Preview.applyZoom();
    });
  }

  /* ---------------------------------------------------------------------
     Mobile tab switcher
     --------------------------------------------------------------------- */

  function bindMobileTabs() {
    const tabs = document.querySelectorAll('.mobile-tabs__btn');
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.toggle('is-active', b === btn));
        const target = btn.dataset.tab;
        document.getElementById('panelInput').classList.toggle('is-active-mobile', target === 'input');
        document.getElementById('panelPreview').classList.toggle('is-active-mobile', target === 'preview');
      });
    });
    // Default: input panel active on mobile
    document.getElementById('panelInput').classList.add('is-active-mobile');
  }

  /* ---------------------------------------------------------------------
     Add question
     --------------------------------------------------------------------- */

  function bindAddQuestion() {
    document.getElementById('btnAddQuestion').addEventListener('click', () => {
      State.addQuestion();
      Editor.renderQuestions();
      Preview.update();

      const cards = document.querySelectorAll('.question-card');
      const lastCard = cards[cards.length - 1];
      if (lastCard) {
        lastCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const firstEditor = lastCard.querySelector('.editor-area');
        if (firstEditor) setTimeout(() => firstEditor.focus(), 260);
      }

      const state = State.get();
      const num = Utils.formatQuestionNumber(state.questions.length - 1, state.language);
      toast(`Question ${num} added`, 'success');
    });
  }

  /* ---------------------------------------------------------------------
     Header save / reset
     --------------------------------------------------------------------- */

  function bindHeaderActions() {
    document.getElementById('btnSave').addEventListener('click', handleSave);
    document.getElementById('btnReset').addEventListener('click', requestReset);
  }

  /* ---------------------------------------------------------------------
     Download
     --------------------------------------------------------------------- */

  function bindDownload() {
    document.getElementById('btnDownload').addEventListener('click', () => {
      PdfGen.downloadDocument();
    });
  }

  /* ---------------------------------------------------------------------
     Language switch buttons
     --------------------------------------------------------------------- */

  function bindLanguageSwitch() {
    document.querySelectorAll('.lang-switch__btn').forEach(btn => {
      btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });
  }

  /* ---------------------------------------------------------------------
     Full re-render (used after load / reset)
     --------------------------------------------------------------------- */

  function fullRerender() {
    const state = State.get();
    document.body.setAttribute('data-doc-lang', state.language);
    document.documentElement.setAttribute('data-theme', state.settings.theme);

    document.querySelectorAll('.lang-switch__btn').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.lang === state.language);
    });

    syncDocumentFieldsFromState();
    Settings.syncFormFromState();
    Editor.renderQuestions();
    Preview.updateImmediate();
    Preview.applyZoom();

    if (window.lucide) lucide.createIcons();
  }

  /* ---------------------------------------------------------------------
     Init
     --------------------------------------------------------------------- */

  function init() {
    // Attempt to restore a previously saved project.
    const saved = Storage.load();
    if (saved) {
      // Merge with defaults to tolerate schema additions across versions.
      const merged = Object.assign(State.defaultState(), saved);
      State.replaceAll(merged);
    }

    Settings.buildColorPresets();
    Editor.initToolbar();

    bindDocumentFields();
    bindZoomControls();
    bindMobileTabs();
    bindAddQuestion();
    bindHeaderActions();
    bindDownload();
    bindLanguageSwitch();
    Settings.bindEvents();

    fullRerender();

    if (saved) toast('Restored your saved project', 'default');

    if (window.lucide) lucide.createIcons();
  }

  document.addEventListener('DOMContentLoaded', init);

  return {
    toast, requestReset, requestDeleteQuestion, handleSave
  };
})();


</script>
</body>
</html>
